name: 대치동 설명회 수집

on:
  schedule:
    # 매일 06:00 KST (= 21:00 UTC 전날). GitHub 스케줄러는 몇 십 분 늦어질 수 있습니다.
    - cron: "0 21 * * *"
  workflow_dispatch: {}

# 같은 브랜치에 밀어 넣으므로 동시에 두 번 돌지 않게 한다
concurrency:
  group: seminar-board
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r day09-seminar-board/scrape/requirements.txt

      - name: 수집 실행
        run: python collect.py
        working-directory: day09-seminar-board/scrape

      - name: 변경분 커밋 & push
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add day09-seminar-board/data.json day09-seminar-board/data.js
          if git diff --staged --quiet; then
            echo "새 설명회 없음 — 커밋 생략"
            exit 0
          fi
          COUNT=$(python -c "import json;print(len(json.load(open('day09-seminar-board/data.json',encoding='utf-8'))['items']))")
          git commit -m "설명회 데이터 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST, ${COUNT}건)"
          # 스케줄 실행이 겹쳐 원격이 앞서 있으면 rebase 후 재시도
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 수집 결과 요약
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('day09-seminar-board/data.json', encoding='utf-8'))
          print(f"### 수집 결과 ({d['generated_at']})\n")
          print("| 학원 | 상태 | 건수 | 마지막 성공 |")
          print("| --- | --- | ---: | --- |")
          for a in d['academies']:
              print(f"| {a['name']} | {a['status']} | {a.get('count') or 0} | {a.get('last_success_at') or '-'} |")
          bad = [a for a in d['academies'] if a['status'] == 'fail']
          if bad:
              print("\n**실패한 학원**\n")
              for a in bad:
                  print(f"- {a['name']}: `{a.get('error')}`")
          PY
