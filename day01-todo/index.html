<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo — Day 01</title>
<style>
  :root {
    --bg: #f5f5f4;
    --surface: #ffffff;
    --border: #e5e5e4;
    --text: #1c1c1b;
    --text-muted: #8a8a86;
    --accent: #2563eb;
    --danger: #dc2626;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  header {
    margin-bottom: 24px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.875rem;
    margin: 0;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.95rem;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  button {
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    border: none;
    border-radius: var(--radius);
    transition: opacity 0.15s, background 0.15s;
  }
  button:hover { opacity: 0.85; }
  .add-btn {
    padding: 12px 18px;
    background: var(--accent);
    color: white;
    font-weight: 600;
  }
  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .filter-btn {
    padding: 6px 12px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.8rem;
    border-radius: 999px;
  }
  .filter-btn.active {
    background: var(--text);
    color: white;
    border-color: var(--text);
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .label {
    flex: 1;
    font-size: 0.95rem;
    word-break: break-word;
    cursor: pointer;
  }
  li.done .label {
    color: var(--text-muted);
    text-decoration: line-through;
  }
  .delete-btn {
    background: transparent;
    color: var(--text-muted);
    font-size: 1.1rem;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .delete-btn:hover {
    color: var(--danger);
    opacity: 1;
  }
  .empty {
    text-align: center;
    padding: 40px 16px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    color: var(--text-muted);
    font-size: 0.8rem;
  }
  .clear-btn {
    background: transparent;
    color: var(--text-muted);
    text-decoration: underline;
    padding: 4px;
    font-size: 0.8rem;
  }
  .clear-btn:hover { color: var(--danger); opacity: 1; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Todo</h1>
      <p class="subtitle">Day 01 — one app a day</p>
    </header>

    <form id="add-form">
      <input type="text" id="new-todo" placeholder="What needs doing?" autocomplete="off" autofocus />
      <button type="submit" class="add-btn">Add</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
    </div>

    <ul id="list"></ul>

    <footer>
      <span id="count"></span>
      <button class="clear-btn" id="clear-done">Clear completed</button>
    </footer>
  </div>

<script>
  const STORAGE_KEY = "day01-todos";
  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let filter = "all";

  const listEl = document.getElementById("list");
  const formEl = document.getElementById("add-form");
  const inputEl = document.getElementById("new-todo");
  const countEl = document.getElementById("count");
  const clearBtn = document.getElementById("clear-done");
  const filterBtns = document.querySelectorAll(".filter-btn");

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function render() {
    const filtered = todos.filter(t =>
      filter === "all" ? true : filter === "active" ? !t.done : t.done
    );

    listEl.innerHTML = "";

    if (filtered.length === 0) {
      const msg = todos.length === 0 ? "No todos yet — add one above." : "Nothing here.";
      listEl.innerHTML = `<li class="empty" style="border:none;">${msg}</li>`;
    } else {
      filtered.forEach(todo => {
        const li = document.createElement("li");
        li.className = todo.done ? "done" : "";
        li.innerHTML = `
          <input type="checkbox" ${todo.done ? "checked" : ""} data-id="${todo.id}" />
          <span class="label" data-id="${todo.id}">${escapeHtml(todo.text)}</span>
          <button class="delete-btn" data-id="${todo.id}" title="Delete">✕</button>
        `;
        listEl.appendChild(li);
      });
    }

    const remaining = todos.filter(t => !t.done).length;
    countEl.textContent = todos.length
      ? `${remaining} item${remaining === 1 ? "" : "s"} left`
      : "";
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  formEl.addEventListener("submit", e => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    todos.unshift({ id: Date.now().toString(), text, done: false });
    inputEl.value = "";
    save();
    render();
  });

  listEl.addEventListener("click", e => {
    const id = e.target.dataset.id;
    if (!id) return;

    if (e.target.matches("input[type='checkbox']") || e.target.matches(".label")) {
      const todo = todos.find(t => t.id === id);
      if (todo) todo.done = !todo.done;
      save();
      render();
    } else if (e.target.matches(".delete-btn")) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }
  });

  clearBtn.addEventListener("click", () => {
    todos = todos.filter(t => !t.done);
    save();
    render();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      filterBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    });
  });

  render();
</script>
</body>
</html>
