<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>문제집 책장</title>
<style>
  :root {
    --bg: #f4f1ea;
    --surface: #fffefb;
    --text: #2f2a24;
    --text-muted: #8d8375;
    --accent: #3f6fd8;
    --accent-soft: #e5ecfb;
    --border: #e3ddd0;
    --danger: #c0453a;
    --wood: #b98a56;
    --wood-dark: #8d6537;
    --wood-edge: #6f4d29;
    --shadow: 0 2px 10px rgba(60, 45, 25, 0.09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191612;
      --surface: #241f1a;
      --text: #f0e9de;
      --text-muted: #a99c89;
      --accent: #7fa4f0;
      --accent-soft: #23304b;
      --border: #383026;
      --danger: #e57a6f;
      --wood: #8a6338;
      --wood-dark: #63452561;
      --wood-edge: #4a3320;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 17px; line-height: 1.55;
  }
  button, input, select, textarea { font-family: inherit; }
  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: 110px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 20px 16px 10px; }
  .topbar h1 { margin: 0; font-size: 19px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 16px; cursor: pointer; flex-shrink: 0; }
  main { padding: 0 16px; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 2px 10px; }
  .section-head h2 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -0.2px; }
  .section-head .count { font-size: 12.5px; color: var(--text-muted); }

  /* ---- 지금 푸는 중 ---- */
  .doing-strip { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
  .doing-strip::-webkit-scrollbar { display: none; }
  .doing-card { flex: 0 0 auto; width: 132px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); cursor: pointer; }
  .doing-card .mini-cover { width: 100%; aspect-ratio: 2/3; border-radius: 8px; overflow: hidden; background: var(--accent-soft); margin-bottom: 8px; }
  .doing-card .mini-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .doing-title { font-size: 13px; font-weight: 800; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 5px; min-height: 34px; }
  .doing-days { font-size: 11.5px; color: var(--accent); font-weight: 800; }
  .doing-done-btn { margin-top: 8px; width: 100%; border: none; border-radius: 9px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 800; padding: 8px 4px; cursor: pointer; }

  /* ---- 전면 책장 ---- */
  .bookcase { background: linear-gradient(180deg, rgba(0,0,0,0.03), rgba(0,0,0,0.06)); border-radius: 16px; padding: 12px 12px 4px; border: 1px solid var(--border); }
  .shelf { margin-bottom: 14px; }
  .shelf-row { display: flex; gap: 10px; align-items: flex-end; min-height: 92px; padding: 0 4px; }
  .shelf-plank { height: 12px; border-radius: 3px; background: linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 60%, var(--wood-edge) 100%); box-shadow: 0 4px 8px rgba(60, 40, 15, 0.25); margin-top: -2px; }
  .book { flex: 1 1 0; min-width: 0; cursor: pointer; }
  .book .cover { width: 100%; aspect-ratio: 2/3; border-radius: 3px 6px 6px 3px; overflow: hidden; background: var(--accent-soft); box-shadow: 2px 3px 7px rgba(50, 35, 15, 0.28), inset 4px 0 0 rgba(0,0,0,0.10); transform-origin: bottom center; transition: transform 0.15s ease; }
  .book:active .cover { transform: translateY(-4px) scale(1.03); }
  .book .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .book .book-label { font-size: 10.5px; color: var(--text-muted); text-align: center; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book.ghost { visibility: hidden; }

  .empty-hint { color: var(--text-muted); text-align: center; padding: 34px 16px; font-size: 14px; line-height: 1.7; }

  /* ---- 버튼 ---- */
  .btn { border: none; border-radius: 12px; padding: 13px 16px; font-size: 15px; font-weight: 800; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-outline { background: var(--surface); color: var(--text); border: 1px solid var(--border); width: 100%; }
  .btn-done { background: #1f9254; color: #fff; width: 100%; }
  .row-btns { display: flex; gap: 8px; }
  .row-btns .btn { flex: 1; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 13.5px; font-weight: 700; cursor: pointer; padding: 6px 2px; }
  .danger-link { display: block; text-align: center; color: var(--danger); font-size: 13.5px; margin-top: 10px; background: none; border: none; cursor: pointer; padding: 8px; width: 100%; }

  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 30; width: min(528px, calc(100% - 32px)); background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 15px; font-size: 16px; font-weight: 800; box-shadow: 0 6px 20px rgba(40, 70, 150, 0.35); cursor: pointer; }

  /* ---- 폼 ---- */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; font-weight: 700; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 15px;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .search-row { display: flex; gap: 8px; }
  .search-row input { flex: 1; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; }
  .search-row button { flex: 0 0 auto; padding: 0 16px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-weight: 800; cursor: pointer; }
  .form-msg { font-size: 13px; margin: 8px 0 0; color: var(--text-muted); min-height: 18px; line-height: 1.5; }
  .form-msg.error { color: var(--danger); }
  .form-msg.success { color: #1f9254; }

  .result-list { margin-top: 10px; max-height: 260px; overflow-y: auto; }
  .result-item { display: flex; gap: 10px; align-items: center; padding: 9px; border: 1px solid var(--border); border-radius: 11px; margin-bottom: 7px; background: var(--surface); cursor: pointer; }
  .result-item img, .result-item .noimg { width: 38px; height: 54px; object-fit: cover; border-radius: 4px; background: var(--accent-soft); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .result-item .ri-title { font-size: 14px; font-weight: 700; line-height: 1.35; }
  .result-item .ri-sub { font-size: 11.5px; color: var(--text-muted); }

  .cover-picker { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  .cover-preview { width: 84px; height: 126px; border-radius: 6px; overflow: hidden; background: var(--accent-soft); border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
  .cover-picker-btns { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .cover-picker-btns .btn { padding: 11px; font-size: 14px; }
  .cover-hint { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; }

  .chip { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 800; color: #fff; }
  .chip-soft { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }

  /* ---- 모달 ---- */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(30, 22, 12, 0.5); z-index: 50; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; border-radius: 20px 20px 0 0; overflow-y: auto; animation: slideUp 0.2s ease; }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { position: sticky; top: 0; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 10px; border-bottom: 1px solid var(--border); z-index: 2; }
  .modal-header h3 { margin: 0; font-size: 18px; }
  .close-btn { background: none; border: none; font-size: 20px; color: var(--text-muted); cursor: pointer; width: 40px; height: 40px; }
  .modal-body { padding: 16px 18px 28px; }
  .modal.center { border-radius: 20px; max-width: 340px; margin: auto; }
  .modal-overlay.center-align { align-items: center; }

  /* ---- 상세 ---- */
  .detail-top { display: flex; gap: 14px; margin-bottom: 16px; }
  .detail-cover { width: 108px; height: 162px; border-radius: 4px 7px 7px 4px; overflow: hidden; flex-shrink: 0; box-shadow: 2px 3px 10px rgba(50,35,15,0.3); }
  .detail-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-info h4 { margin: 0 0 6px; font-size: 17px; line-height: 1.35; }
  .detail-info .pub { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
  .detail-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .stat-strip { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
  .stat-cell { flex: 1; text-align: center; padding: 12px 4px; border-right: 1px solid var(--border); }
  .stat-cell:last-child { border-right: none; }
  .stat-cell .v { font-size: 17px; font-weight: 800; }
  .stat-cell .k { font-size: 11px; color: var(--text-muted); }

  /* ---- 통계 ---- */
  .big-stats { display: flex; gap: 10px; margin-bottom: 18px; }
  .big-stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 8px; text-align: center; }
  .big-stat .v { font-size: 22px; font-weight: 800; }
  .big-stat .k { font-size: 11.5px; color: var(--text-muted); }
  .bar-row { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .bar-name { width: 46px; font-size: 12.5px; font-weight: 700; flex-shrink: 0; }
  .bar-track { flex: 1; height: 16px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }
  .bar-val { width: 34px; text-align: right; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }

  /* ---- 스캐너 ---- */
  #scanVideo { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 4/3; object-fit: cover; }
  .scan-guide { position: relative; margin-bottom: 12px; }
  .scan-frame { position: absolute; left: 10%; right: 10%; top: 34%; height: 30%; border: 2px solid rgba(255,255,255,0.9); border-radius: 8px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.25); }

  /* ---- 공유 ---- */
  .share-img { width: 100%; border-radius: 14px; margin-bottom: 14px; box-shadow: var(--shadow); display: block; }

  /* ---- 축하 ---- */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; display: none; }
  #confetti.on { display: block; }
  .conf { position: absolute; font-size: 22px; animation: fall linear forwards; }
  @keyframes fall { from { transform: translateY(-60px) rotate(0deg); opacity: 1; } to { transform: translateY(105vh) rotate(540deg); opacity: 0.9; } }
  .cheer { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 95; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 22px 26px; text-align: center; box-shadow: 0 10px 34px rgba(40,30,10,0.28); display: none; animation: pop 0.25s ease; }
  .cheer.on { display: block; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .cheer .emo { font-size: 40px; }
  .cheer .msg { font-size: 17px; font-weight: 800; margin-top: 6px; }
  .cheer .sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 id="pageTitle">문제집 책장</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="statsBtn" title="통계">📊</button>
      <button class="icon-btn" id="shareBtn" title="책장 공유">📤</button>
      <button class="icon-btn" id="settingsBtn" title="설정">⚙️</button>
    </div>
  </div>
  <main>
    <section id="doingSection">
      <div class="section-head">
        <h2>📖 지금 푸는 중</h2>
        <span class="count" id="doingCount"></span>
      </div>
      <div class="doing-strip" id="doingStrip"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>🏆 다 푼 문제집</h2>
        <span class="count" id="doneCount"></span>
      </div>
      <div class="bookcase" id="bookcase"></div>
    </section>
  </main>
</div>

<button class="fab" id="addBtn">＋ 문제집 추가</button>

<!-- 처음 등록 -->
<div id="onboardModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>반가워요 📚</h3></div>
    <div class="modal-body">
      <p style="font-size:14px;color:var(--text-muted);margin:0 0 16px;">푼 문제집을 표지로 모아 책장에 진열해요.</p>
      <div class="field">
        <label>닉네임</label>
        <input type="text" id="onboardNick" placeholder="예: 보민" maxlength="10">
      </div>
      <div class="field">
        <label>학년</label>
        <select id="onboardGrade">
          <option value="중1">중1</option>
          <option value="중2">중2</option>
          <option value="중3">중3</option>
          <option value="고1">고1</option>
          <option value="고2">고2</option>
          <option value="고3">고3</option>
        </select>
      </div>
      <p class="form-msg error" id="onboardMsg"></p>
      <button class="btn btn-primary" id="onboardSubmit">내 책장 만들기</button>
    </div>
  </div>
</div>

<!-- 문제집 추가 -->
<div id="addModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>문제집 추가</h3><button class="close-btn" data-close="addModal">✕</button></div>
    <div class="modal-body">
      <div class="cover-picker">
        <div class="cover-preview" id="coverPreview">📕</div>
        <div class="cover-picker-btns">
          <button class="btn btn-primary" id="shotBtn">📷 표지 사진 찍기</button>
          <button class="btn btn-outline" id="pickBtn">🖼️ 앨범에서 고르기</button>
          <span class="cover-hint">표지를 올리지 않으면 과목 색으로 표지를 만들어 드려요.</span>
        </div>
      </div>

      <div class="field">
        <label>문제집 찾기</label>
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="제목 검색 (예: 쎈 중2)">
          <button id="searchGoBtn">검색</button>
        </div>
        <div class="row-btns" style="margin-top:8px;">
          <button class="btn btn-outline" id="scanOpenBtn" style="padding:10px;font-size:14px;">📷 바코드(ISBN) 스캔</button>
          <button class="btn btn-outline" id="manualBtn" style="padding:10px;font-size:14px;">✍️ 직접 입력</button>
        </div>
        <p class="form-msg" id="searchMsg"></p>
        <div class="result-list" id="resultList"></div>
      </div>

      <div id="manualFields" style="display:none;">
        <div class="field">
          <label>제목</label>
          <input type="text" id="fTitle" placeholder="문제집 제목">
        </div>
        <div class="field">
          <label>출판사</label>
          <input type="text" id="fPublisher" placeholder="출판사 (몰라도 괜찮아요)">
        </div>
        <div class="field-row">
          <div class="field">
            <label>과목 <span id="subjAuto" style="color:var(--accent);"></span></label>
            <select id="fSubject"></select>
          </div>
          <div class="field">
            <label>대상 학년 <span id="gradeAuto" style="color:var(--accent);"></span></label>
            <select id="fGrade"></select>
          </div>
        </div>
        <div class="field">
          <label>시작한 날</label>
          <input type="date" id="fStart">
        </div>
        <p class="form-msg error" id="addMsg"></p>
        <button class="btn btn-primary" id="saveBookBtn">책장에 꽂기</button>
      </div>
    </div>
  </div>
</div>

<!-- 바코드 스캔 -->
<div id="scanModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>바코드 스캔</h3><button class="close-btn" data-close="scanModal">✕</button></div>
    <div class="modal-body">
      <div class="scan-guide" id="scanGuide">
        <video id="scanVideo" playsinline muted></video>
        <div class="scan-frame"></div>
      </div>
      <p class="form-msg" id="scanMsg">문제집 뒷면 바코드를 네모 안에 맞춰 주세요.</p>
      <div class="field" style="margin-top:10px;">
        <label>안 될 땐 ISBN 숫자를 직접 입력</label>
        <div class="search-row">
          <input type="text" id="isbnInput" inputmode="numeric" placeholder="예: 9788961057851">
          <button id="isbnGoBtn">찾기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 상세 -->
<div id="detailModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>문제집 기록</h3><button class="close-btn" data-close="detailModal">✕</button></div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<!-- 통계 -->
<div id="statsModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>내 기록</h3><button class="close-btn" data-close="statsModal">✕</button></div>
    <div class="modal-body" id="statsBody"></div>
  </div>
</div>

<!-- 공유 -->
<div id="shareModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>책장 이미지</h3><button class="close-btn" data-close="shareModal">✕</button></div>
    <div class="modal-body">
      <img class="share-img" id="shareImg" alt="내 책장 이미지">
      <a class="btn btn-primary" id="shareDownload" download="workbook-shelf.png" style="display:block;text-align:center;text-decoration:none;">이미지 저장하기</a>
      <p class="form-msg">저장이 안 되면 이미지를 길게 눌러 저장하세요.</p>
    </div>
  </div>
</div>

<!-- 설정 -->
<div id="settingsModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>설정</h3><button class="close-btn" data-close="settingsModal">✕</button></div>
    <div class="modal-body">
      <div class="field">
        <label>닉네임</label>
        <input type="text" id="setNick" maxlength="10">
      </div>
      <div class="field">
        <label>학년</label>
        <select id="setGrade"></select>
      </div>
      <div class="field">
        <label>카카오 책 검색 REST 키 (선택)</label>
        <input type="text" id="setKakao" placeholder="비워두면 구글 책 검색을 써요">
        <span class="cover-hint">카카오 키를 넣으면 한국 문제집 검색이 훨씬 잘 돼요.</span>
      </div>
      <p class="form-msg success" id="setMsg"></p>
      <button class="btn btn-primary" id="setSaveBtn">저장</button>
      <button class="danger-link" id="resetBtn">기록 전체 지우기</button>
    </div>
  </div>
</div>

<div id="confetti"></div>
<div class="cheer" id="cheer">
  <div class="emo">🎉</div>
  <div class="msg" id="cheerMsg">다 풀었어요!</div>
  <div class="sub" id="cheerSub"></div>
</div>

<input type="file" id="shotInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="pickInput" accept="image/*" style="display:none">

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'workbook-shelf-v1';

  // ---------- 유틸 ----------
  function $(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function parseDate(s) {
    if (!s) return null;
    var p = String(s).split('-');
    if (p.length !== 3) return null;
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return isNaN(d.getTime()) ? null : d;
  }
  function dayDiff(fromStr, toStr) {
    var a = parseDate(fromStr), b = parseDate(toStr);
    if (!a || !b) return null;
    return Math.round((b - a) / 86400000) + 1; // 시작한 날 당일 완료 = 1일
  }
  function formatKDate(s) {
    var d = parseDate(s);
    if (!d) return '-';
    return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }
  function subjectOf(name) {
    for (var i = 0; i < SUBJECTS.length; i++) if (SUBJECTS[i].name === name) return SUBJECTS[i];
    return SUBJECTS[SUBJECTS.length - 1];
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // ---------- 자동 분류 ----------
  function guessSubject(text) {
    var t = String(text || '').toLowerCase();
    var best = null, bestScore = 0;
    Object.keys(SUBJECT_KEYWORDS).forEach(function (subject) {
      var score = 0;
      SUBJECT_KEYWORDS[subject].forEach(function (kw) {
        if (t.indexOf(kw.toLowerCase()) !== -1) score += kw.length >= 3 ? 2 : 1;
      });
      if (score > bestScore) { bestScore = score; best = subject; }
    });
    return best || '기타';
  }
  function guessGrade(text, fallback) {
    var t = String(text || '');
    if (/예비\s*고/.test(t)) return '고1';
    if (/수능특강|수능완성|수능|평가원|모의고사/.test(t)) return '수능';
    var m = t.match(/([중고])\s*등?\s*학?\s*교?\s*([1-3])\s*학년/);
    if (m) return m[1] + m[2];
    m = t.match(/(중|고)\s*([1-3])(?![0-9])/);
    if (m) return m[1] + m[2];
    // "쎈 중등 수학 2-1"처럼 학교급만 있고 숫자가 따로 붙은 제목
    var isMiddle = /중등|중학/.test(t), isHigh = /고등|고교/.test(t);
    if (isMiddle || isHigh) {
      var n = t.match(/(?:^|[^0-9])([1-3])\s*(?:-\s*[1-2]|학년)/);
      if (n) return (isMiddle ? '중' : '고') + n[1];
      return isMiddle ? '중등 공통' : '고등 공통';
    }
    return fallback || (state.profile && state.profile.grade) || '중등 공통';
  }

  // ---------- 표지 이미지 ----------
  function cropToCover(file, targetW, targetH) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement('canvas');
          canvas.width = targetW; canvas.height = targetH;
          var ctx = canvas.getContext('2d');
          var srcRatio = img.width / img.height, dstRatio = targetW / targetH;
          var sx, sy, sw, sh;
          if (srcRatio > dstRatio) { sh = img.height; sw = sh * dstRatio; sx = (img.width - sw) / 2; sy = 0; }
          else { sw = img.width; sh = sw / dstRatio; sx = 0; sy = (img.height - sh) / 2; }
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function makeGeneratedCover(title, publisher, subject, grade) {
    var canvas = document.createElement('canvas');
    canvas.width = 480; canvas.height = 720;
    var ctx = canvas.getContext('2d');
    var sub = subjectOf(subject);
    var grad = ctx.createLinearGradient(0, 0, 0, 720);
    grad.addColorStop(0, sub.color);
    grad.addColorStop(1, shade(sub.color, -0.35));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 480, 720);

    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fillRect(0, 0, 26, 720);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(56, 560, 368, 3);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = '600 46px sans-serif';
    var lines = wrapText(ctx, String(title || '문제집'), 350);
    var startY = 250 - (Math.min(lines.length, 4) - 1) * 30;
    lines.slice(0, 4).forEach(function (line, i) {
      ctx.fillText(line, 250, startY + i * 60);
    });

    ctx.font = '30px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText(sub.emoji + ' ' + sub.name, 250, 610);
    ctx.font = '26px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(grade || '', 250, 652);
    if (publisher) {
      ctx.font = '24px sans-serif';
      ctx.fillText(publisher, 250, 690);
    }
    return canvas.toDataURL('image/jpeg', 0.85);
  }

  function shade(hex, amt) {
    var m = /^#([0-9a-f]{6})$/i.exec(hex);
    if (!m) return hex;
    var n = parseInt(m[1], 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    function adj(c) { return Math.max(0, Math.min(255, Math.round(c + 255 * amt))); }
    return 'rgb(' + adj(r) + ',' + adj(g) + ',' + adj(b) + ')';
  }

  function wrapText(ctx, text, maxWidth) {
    var chars = String(text).split('');
    var lines = [], line = '';
    for (var i = 0; i < chars.length; i++) {
      var test = line + chars[i];
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = chars[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }

  function fetchCoverAsDataUrl(url) {
    return new Promise(function (resolve) {
      if (!url) return resolve(null);
      var img = new Image();
      img.crossOrigin = 'anonymous';
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; resolve(null); } }, 6000);
      img.onload = function () {
        if (done) return;
        done = true; clearTimeout(timer);
        try {
          var canvas = document.createElement('canvas');
          canvas.width = 480; canvas.height = 720;
          var ctx = canvas.getContext('2d');
          var srcRatio = img.width / img.height, dstRatio = 480 / 720;
          var sx, sy, sw, sh;
          if (srcRatio > dstRatio) { sh = img.height; sw = sh * dstRatio; sx = (img.width - sw) / 2; sy = 0; }
          else { sw = img.width; sh = sw / dstRatio; sx = 0; sy = (img.height - sh) / 2; }
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 480, 720);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        } catch (e) { resolve(null); }
      };
      img.onerror = function () { if (!done) { done = true; clearTimeout(timer); resolve(null); } };
      img.src = url.replace(/^http:/, 'https:');
    });
  }

  // ---------- 책 검색 ----------
  function searchBooks(query, isIsbn) {
    if (state.kakaoKey) return searchKakao(query, isIsbn).catch(function () { return searchGoogle(query, isIsbn); });
    return searchGoogle(query, isIsbn);
  }

  function searchKakao(query, isIsbn) {
    var url = 'https://dapi.kakao.com/v3/search/book?size=10&target=' + (isIsbn ? 'isbn' : 'title') +
      '&query=' + encodeURIComponent(query);
    return fetch(url, { headers: { Authorization: 'KakaoAK ' + state.kakaoKey } })
      .then(function (r) {
        if (!r.ok) throw new Error('kakao ' + r.status);
        return r.json();
      })
      .then(function (data) {
        return (data.documents || []).map(function (d) {
          return {
            title: d.title || '',
            publisher: d.publisher || '',
            isbn: (d.isbn || '').split(' ').pop() || '',
            thumbnail: d.thumbnail || ''
          };
        });
      });
  }

  function searchGoogle(query, isIsbn) {
    var q = isIsbn ? 'isbn:' + String(query).replace(/[^0-9Xx]/g, '') : query;
    var url = 'https://www.googleapis.com/books/v1/volumes?maxResults=10&country=KR&q=' +
      encodeURIComponent(q) + '&key=' + GOOGLE_BOOKS_API_KEY;
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('google ' + r.status);
      return r.json();
    }).then(function (data) {
      return (data.items || []).map(function (item) {
        var v = item.volumeInfo || {};
        var ids = v.industryIdentifiers || [];
        var isbn = '';
        ids.forEach(function (i) { if (i.type === 'ISBN_13') isbn = i.identifier; });
        var thumb = (v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail)) || '';
        return {
          title: v.title || '',
          publisher: v.publisher || (v.authors ? v.authors.join(', ') : ''),
          isbn: isbn,
          thumbnail: thumb
        };
      });
    });
  }

  // ---------- 렌더링 ----------
  function render() {
    if (!state.profile) return;
    $('pageTitle').textContent = state.profile.nickname + '의 문제집 책장';
    document.title = state.profile.nickname + '의 문제집 책장';
    renderDoing();
    renderShelf();
  }

  function renderDoing() {
    var doing = state.books.filter(function (b) { return !b.endDate; })
      .sort(function (a, b) { return (a.startDate < b.startDate ? 1 : -1); });
    $('doingCount').textContent = doing.length ? doing.length + '권' : '';
    var strip = $('doingStrip');
    if (!doing.length) {
      strip.innerHTML = '<div class="empty-hint" style="width:100%;padding:22px 8px;">지금 푸는 문제집이 없어요.<br>아래 버튼으로 추가해 보세요.</div>';
      return;
    }
    strip.innerHTML = doing.map(function (b) {
      var days = dayDiff(b.startDate, todayStr());
      return '<div class="doing-card" data-open="' + b.id + '">' +
        '<div class="mini-cover"><img src="' + escapeHtml(b.cover) + '" alt=""></div>' +
        '<div class="doing-title">' + escapeHtml(b.title) + '</div>' +
        '<div class="doing-days">' + (days != null ? days + '일째' : '') + '</div>' +
        '<button class="doing-done-btn" data-finish="' + b.id + '">다 풀었어요!</button>' +
        '</div>';
    }).join('');
  }

  function renderShelf() {
    var done = state.books.filter(function (b) { return b.endDate; })
      .sort(function (a, b) {
        if (a.endDate === b.endDate) return (b.createdAt || 0) - (a.createdAt || 0);
        return a.endDate < b.endDate ? 1 : -1;
      });
    $('doneCount').textContent = done.length ? done.length + '권' : '';
    var box = $('bookcase');
    if (!done.length) {
      box.innerHTML = '<div class="empty-hint">아직 진열된 문제집이 없어요.<br>한 권 다 풀면 여기 표지가 꽂혀요 📚</div>' +
        '<div class="shelf-plank" style="margin-bottom:12px;"></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < done.length; i += 3) {
      var row = done.slice(i, i + 3);
      html += '<div class="shelf"><div class="shelf-row">';
      row.forEach(function (b) {
        html += '<div class="book" data-open="' + b.id + '">' +
          '<div class="cover"><img src="' + escapeHtml(b.cover) + '" alt="' + escapeHtml(b.title) + '"></div>' +
          '<div class="book-label">' + escapeHtml(b.title) + '</div></div>';
      });
      for (var k = row.length; k < 3; k++) html += '<div class="book ghost"><div class="cover"></div></div>';
      html += '</div><div class="shelf-plank"></div></div>';
    }
    box.innerHTML = html;
  }

  // ---------- 상세 ----------
  function openDetail(id) {
    var b = findBook(id);
    if (!b) return;
    var sub = subjectOf(b.subject);
    var done = !!b.endDate;
    var days = done ? dayDiff(b.startDate, b.endDate) : dayDiff(b.startDate, todayStr());
    var html = '';
    html += '<div class="detail-top">' +
      '<div class="detail-cover"><img src="' + escapeHtml(b.cover) + '" alt=""></div>' +
      '<div class="detail-info">' +
      '<h4>' + escapeHtml(b.title) + '</h4>' +
      '<div class="pub">' + escapeHtml(b.publisher || '출판사 미입력') + '</div>' +
      '<div class="detail-chips">' +
      '<span class="chip" style="background:' + sub.color + '">' + sub.emoji + ' ' + escapeHtml(sub.name) + '</span>' +
      '<span class="chip-soft">' + escapeHtml(b.grade || '') + '</span>' +
      '</div></div></div>';

    html += '<div class="stat-strip">' +
      '<div class="stat-cell"><div class="v">' + (parseDate(b.startDate) ? (parseDate(b.startDate).getMonth() + 1) + '.' + parseDate(b.startDate).getDate() : '-') + '</div><div class="k">시작</div></div>' +
      '<div class="stat-cell"><div class="v">' + (done && parseDate(b.endDate) ? (parseDate(b.endDate).getMonth() + 1) + '.' + parseDate(b.endDate).getDate() : '···') + '</div><div class="k">완료</div></div>' +
      '<div class="stat-cell"><div class="v">' + (days != null ? days : '-') + '일</div><div class="k">' + (done ? '걸린 날' : '진행 중') + '</div></div>' +
      '</div>';

    html += '<p style="font-size:14px;color:var(--text-muted);margin:0 0 14px;line-height:1.7;">' +
      formatKDate(b.startDate) + '에 시작' + (done ? '해서 ' + formatKDate(b.endDate) + '에 끝냈어요.<br>총 ' + days + '일 걸렸어요.' : '했어요. 오늘로 ' + days + '일째!') +
      '</p>';

    html += '<div class="field"><label>한 줄 메모</label>' +
      '<input type="text" id="dMemo" maxlength="60" placeholder="어땠어요? (예: 오답만 3번 봤다)" value="' + escapeHtml(b.memo || '') + '"></div>';

    html += '<div class="field-row">' +
      '<div class="field"><label>시작한 날</label><input type="date" id="dStart" value="' + escapeHtml(b.startDate) + '"></div>' +
      '<div class="field"><label>다 푼 날</label><input type="date" id="dEnd" value="' + escapeHtml(b.endDate || '') + '"></div>' +
      '</div>';
    html += '<p class="form-msg" id="dMsg"></p>';

    if (!done) html += '<button class="btn btn-done" id="dFinish">🎉 다 풀었어요!</button>';
    html += '<button class="danger-link" id="dDelete">이 기록 지우기</button>';

    $('detailBody').innerHTML = html;

    $('dMemo').addEventListener('change', function () {
      b.memo = this.value.trim();
      saveState();
      showMsg('dMsg', '메모를 저장했어요.', 'success');
    });
    $('dStart').addEventListener('change', function () { updateDates(b); });
    $('dEnd').addEventListener('change', function () { updateDates(b); });
    if ($('dFinish')) $('dFinish').addEventListener('click', function () { finishBook(b.id, true); });
    $('dDelete').addEventListener('click', function () {
      if (!confirm('이 문제집 기록을 지울까요?')) return;
      state.books = state.books.filter(function (x) { return x.id !== b.id; });
      saveState(); render(); closeModal('detailModal');
    });

    openModal('detailModal');
  }

  function updateDates(b) {
    var s = $('dStart').value, e = $('dEnd').value;
    if (!s) { showMsg('dMsg', '시작한 날은 비워둘 수 없어요.', 'error'); $('dStart').value = b.startDate; return; }
    if (e && e < s) { showMsg('dMsg', '다 푼 날은 시작한 날보다 빠를 수 없어요.', 'error'); $('dEnd').value = b.endDate || ''; return; }
    b.startDate = s;
    b.endDate = e || null;
    saveState();
    render();
    openDetail(b.id);
    showMsg('dMsg', '날짜를 저장했어요.', 'success');
  }

  function showMsg(id, text, cls) {
    var el = $(id);
    if (!el) return;
    el.textContent = text;
    el.className = 'form-msg' + (cls ? ' ' + cls : '');
  }

  function findBook(id) {
    for (var i = 0; i < state.books.length; i++) if (state.books[i].id === id) return state.books[i];
    return null;
  }

  // ---------- 완료 처리 ----------
  function finishBook(id, fromDetail) {
    var b = findBook(id);
    if (!b || b.endDate) return;
    b.endDate = todayStr();
    saveState();
    render();
    if (fromDetail) closeModal('detailModal');
    celebrate(b);
  }

  function celebrate(b) {
    var days = dayDiff(b.startDate, b.endDate);
    var doneCount = state.books.filter(function (x) { return x.endDate; }).length;
    $('cheerMsg').textContent = days + '일 만에 끝냈어요!';
    $('cheerSub').textContent = b.title + ' · 책장에 ' + doneCount + '번째로 꽂혔어요';
    $('cheer').classList.add('on');

    var layer = $('confetti');
    layer.classList.add('on');
    layer.innerHTML = '';
    var emojis = ['🎉', '✨', '📚', '⭐', '🎊', '💪'];
    for (var i = 0; i < 34; i++) {
      var s = document.createElement('span');
      s.className = 'conf';
      s.textContent = emojis[i % emojis.length];
      s.style.left = Math.random() * 96 + '%';
      s.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
      s.style.animationDelay = (Math.random() * 0.5) + 's';
      layer.appendChild(s);
    }
    setTimeout(function () {
      layer.classList.remove('on');
      layer.innerHTML = '';
      $('cheer').classList.remove('on');
    }, 2600);
  }

  // ---------- 모달 ----------
  function openModal(id) { $(id).classList.add('open'); }
  function closeModal(id) {
    $(id).classList.remove('open');
    if (id === 'scanModal') stopScan();
  }
  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', function () { closeModal(btn.dataset.close); });
  });
  document.querySelectorAll('.modal-overlay').forEach(function (ov) {
    ov.addEventListener('click', function (e) {
      if (e.target === ov && ov.id !== 'onboardModal') closeModal(ov.id);
    });
  });

  // ---------- 처음 등록 ----------
  $('onboardSubmit').addEventListener('click', function () {
    var nick = $('onboardNick').value.trim();
    if (!nick) { showMsg('onboardMsg', '닉네임을 입력해 주세요.', 'error'); return; }
    state.profile = { nickname: nick, grade: $('onboardGrade').value };
    saveState();
    closeModal('onboardModal');
    render();
  });

  // ---------- 추가 흐름 ----------
  function resetDraft() {
    draft = { cover: null, title: '', publisher: '', isbn: '', subject: '기타', grade: state.profile ? state.profile.grade : '중등 공통', thumbnail: '' };
    $('coverPreview').innerHTML = '📕';
    $('searchInput').value = '';
    $('resultList').innerHTML = '';
    showMsg('searchMsg', '', '');
    showMsg('addMsg', '', '');
    $('manualFields').style.display = 'none';
    $('fTitle').value = '';
    $('fPublisher').value = '';
    $('fStart').value = todayStr();
    $('subjAuto').textContent = '';
    $('gradeAuto').textContent = '';
  }

  function fillSelect(el, options, value) {
    el.innerHTML = options.map(function (o) {
      return '<option value="' + escapeHtml(o) + '"' + (o === value ? ' selected' : '') + '>' + escapeHtml(o) + '</option>';
    }).join('');
  }

  function showManual(auto) {
    $('manualFields').style.display = 'block';
    var title = $('fTitle').value;
    if (auto && title) {
      var text = title + ' ' + $('fPublisher').value;
      var s = guessSubject(text);
      var g = guessGrade(text);
      fillSelect($('fSubject'), SUBJECTS.map(function (x) { return x.name; }), s);
      fillSelect($('fGrade'), GRADE_OPTIONS, g);
      $('subjAuto').textContent = '· 자동 분류됨';
      $('gradeAuto').textContent = '· 자동 분류됨';
    } else {
      if (!$('fSubject').options.length) fillSelect($('fSubject'), SUBJECTS.map(function (x) { return x.name; }), '기타');
      if (!$('fGrade').options.length) fillSelect($('fGrade'), GRADE_OPTIONS, state.profile ? state.profile.grade : '중등 공통');
    }
    $('manualFields').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  $('addBtn').addEventListener('click', function () {
    if (!state.profile) { openModal('onboardModal'); return; }
    resetDraft();
    fillSelect($('fSubject'), SUBJECTS.map(function (x) { return x.name; }), '기타');
    fillSelect($('fGrade'), GRADE_OPTIONS, state.profile.grade);
    openModal('addModal');
  });

  $('manualBtn').addEventListener('click', function () {
    if (!$('fTitle').value) $('fTitle').value = $('searchInput').value.trim();
    showManual(!!$('fTitle').value);
  });

  $('fTitle').addEventListener('change', function () {
    var text = this.value + ' ' + $('fPublisher').value;
    if (!this.value.trim()) return;
    fillSelect($('fSubject'), SUBJECTS.map(function (x) { return x.name; }), guessSubject(text));
    fillSelect($('fGrade'), GRADE_OPTIONS, guessGrade(text));
    $('subjAuto').textContent = '· 자동 분류됨';
    $('gradeAuto').textContent = '· 자동 분류됨';
  });

  $('searchGoBtn').addEventListener('click', function () { doSearch($('searchInput').value.trim(), false); });
  $('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); doSearch(this.value.trim(), false); }
  });

  function doSearch(query, isIsbn) {
    if (!query) { showMsg('searchMsg', '검색할 제목을 입력해 주세요.', 'error'); return; }
    showMsg('searchMsg', '찾는 중…', '');
    $('resultList').innerHTML = '';
    searchBooks(query, isIsbn).then(function (items) {
      if (!items.length) {
        showMsg('searchMsg', '검색 결과가 없어요. 아래에 직접 입력해 주세요.', '');
        $('fTitle').value = isIsbn ? '' : query;
        showManual(!isIsbn);
        return;
      }
      showMsg('searchMsg', items.length + '권 찾았어요. 맞는 문제집을 눌러 주세요.', 'success');
      $('resultList').innerHTML = items.map(function (it, i) {
        return '<div class="result-item" data-idx="' + i + '">' +
          (it.thumbnail ? '<img src="' + escapeHtml(it.thumbnail) + '" alt="">' : '<span class="noimg">📘</span>') +
          '<div><div class="ri-title">' + escapeHtml(it.title) + '</div>' +
          '<div class="ri-sub">' + escapeHtml(it.publisher || '출판사 정보 없음') + '</div></div></div>';
      }).join('');
      $('resultList').querySelectorAll('.result-item').forEach(function (el) {
        el.addEventListener('click', function () { pickResult(items[Number(el.dataset.idx)]); });
      });
      if (isIsbn) pickResult(items[0]);
    }).catch(function () {
      showMsg('searchMsg', '검색을 못 했어요. (파일로 열면 검색이 막혀요) 아래에 직접 입력해 주세요.', 'error');
      $('fTitle').value = isIsbn ? '' : query;
      showManual(!isIsbn);
    });
  }

  function pickResult(item) {
    $('fTitle').value = item.title;
    $('fPublisher').value = item.publisher || '';
    draft.isbn = item.isbn || '';
    draft.thumbnail = item.thumbnail || '';
    var text = item.title + ' ' + (item.publisher || '');
    fillSelect($('fSubject'), SUBJECTS.map(function (x) { return x.name; }), guessSubject(text));
    fillSelect($('fGrade'), GRADE_OPTIONS, guessGrade(text));
    $('subjAuto').textContent = '· 자동 분류됨';
    $('gradeAuto').textContent = '· 자동 분류됨';
    showMsg('searchMsg', '제목과 출판사를 가져왔어요. 맞는지 확인해 주세요.', 'success');
    $('resultList').innerHTML = '';
    closeModal('scanModal');
    showManual(false);
  }

  // 표지 사진
  $('shotBtn').addEventListener('click', function () { $('shotInput').click(); });
  $('pickBtn').addEventListener('click', function () { $('pickInput').click(); });
  ['shotInput', 'pickInput'].forEach(function (id) {
    $(id).addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      cropToCover(file, 480, 720).then(function (dataUrl) {
        draft.cover = dataUrl;
        $('coverPreview').innerHTML = '<img src="' + dataUrl + '" alt="">';
      }).catch(function () {
        showMsg('addMsg', '사진을 읽지 못했어요. 다른 사진으로 해볼까요?', 'error');
      });
    });
  });

  // 저장
  $('saveBookBtn').addEventListener('click', function () {
    var title = $('fTitle').value.trim();
    if (!title) { showMsg('addMsg', '제목을 입력해 주세요.', 'error'); return; }
    var start = $('fStart').value || todayStr();
    if (start > todayStr()) { showMsg('addMsg', '시작한 날이 오늘보다 뒤일 수 없어요.', 'error'); return; }
    var publisher = $('fPublisher').value.trim();
    var subject = $('fSubject').value;
    var grade = $('fGrade').value;

    var coverPromise = draft.cover
      ? Promise.resolve(draft.cover)
      : fetchCoverAsDataUrl(draft.thumbnail).then(function (d) {
          return d || makeGeneratedCover(title, publisher, subject, grade);
        });

    showMsg('addMsg', '저장 중…', '');
    coverPromise.then(function (cover) {
      var book = {
        id: uid(), title: title, publisher: publisher, subject: subject, grade: grade,
        isbn: draft.isbn || '', cover: cover, startDate: start, endDate: null, memo: '',
        createdAt: Date.now()
      };
      state.books.push(book);
      if (!saveState()) {
        state.books.pop();
        showMsg('addMsg', '저장 공간이 가득 찼어요. 오래된 기록을 지우고 다시 해주세요.', 'error');
        return;
      }
      closeModal('addModal');
      render();
    });
  });

  // ---------- 바코드 스캔 ----------
  var scanStream = null, scanTimer = null, detector = null;

  $('scanOpenBtn').addEventListener('click', function () {
    openModal('scanModal');
    startScan();
  });
  $('isbnGoBtn').addEventListener('click', function () {
    var v = $('isbnInput').value.replace(/[^0-9Xx]/g, '');
    if (v.length < 10) { showMsg('scanMsg', 'ISBN 숫자를 정확히 입력해 주세요.', 'error'); return; }
    lookupIsbn(v);
  });

  function startScan() {
    if (!('BarcodeDetector' in window)) {
      showMsg('scanMsg', '이 브라우저는 바코드 스캔을 지원하지 않아요. 아래에 ISBN 숫자를 입력해 주세요.', 'error');
      $('scanGuide').style.display = 'none';
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMsg('scanMsg', '카메라를 쓸 수 없어요. 아래에 ISBN 숫자를 입력해 주세요.', 'error');
      $('scanGuide').style.display = 'none';
      return;
    }
    $('scanGuide').style.display = 'block';
    showMsg('scanMsg', '카메라를 켜는 중…', '');
    try { detector = new window.BarcodeDetector({ formats: ['ean_13'] }); }
    catch (e) { detector = new window.BarcodeDetector(); }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function (stream) {
      scanStream = stream;
      var video = $('scanVideo');
      video.srcObject = stream;
      video.play();
      showMsg('scanMsg', '문제집 뒷면 바코드를 네모 안에 맞춰 주세요.', '');
      scanTimer = setInterval(function () {
        if (!detector || video.readyState < 2) return;
        detector.detect(video).then(function (codes) {
          if (!codes || !codes.length) return;
          var value = String(codes[0].rawValue || '').replace(/[^0-9Xx]/g, '');
          if (value.length < 10) return;
          stopScan();
          showMsg('scanMsg', 'ISBN ' + value + ' 찾는 중…', 'success');
          lookupIsbn(value);
        }).catch(function () {});
      }, 500);
    }).catch(function () {
      showMsg('scanMsg', '카메라 권한이 없어요. 아래에 ISBN 숫자를 입력해 주세요.', 'error');
      $('scanGuide').style.display = 'none';
    });
  }

  function stopScan() {
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
    if (scanStream) {
      scanStream.getTracks().forEach(function (t) { t.stop(); });
      scanStream = null;
    }
    var v = $('scanVideo');
    if (v) v.srcObject = null;
  }

  function lookupIsbn(isbn) {
    searchBooks(isbn, true).then(function (items) {
      if (!items.length) {
        showMsg('scanMsg', '그 ISBN으로는 못 찾았어요. 직접 입력으로 넘어갈게요.', 'error');
        draft.isbn = isbn;
        closeModal('scanModal');
        showManual(false);
        return;
      }
      pickResult(items[0]);
    }).catch(function () {
      showMsg('scanMsg', '검색을 못 했어요. 직접 입력으로 넘어갈게요.', 'error');
      draft.isbn = isbn;
      closeModal('scanModal');
      showManual(false);
    });
  }

  // ---------- 목록 클릭 ----------
  document.addEventListener('click', function (e) {
    var fin = e.target.closest ? e.target.closest('[data-finish]') : null;
    if (fin) { e.stopPropagation(); finishBook(fin.dataset.finish, false); return; }
    var open = e.target.closest ? e.target.closest('[data-open]') : null;
    if (open) openDetail(open.dataset.open);
  });

  // ---------- 통계 ----------
  function computeStats() {
    var done = state.books.filter(function (b) { return b.endDate; });
    var year = new Date().getFullYear();
    var thisYear = done.filter(function (b) { return parseDate(b.endDate) && parseDate(b.endDate).getFullYear() === year; });
    var totalDays = 0, counted = 0;
    done.forEach(function (b) {
      var d = dayDiff(b.startDate, b.endDate);
      if (d != null && d > 0) { totalDays += d; counted++; }
    });
    var bySubject = {};
    SUBJECTS.forEach(function (s) { bySubject[s.name] = 0; });
    done.forEach(function (b) {
      if (bySubject[b.subject] == null) bySubject[b.subject] = 0;
      bySubject[b.subject]++;
    });
    return {
      done: done.length,
      doing: state.books.length - done.length,
      thisYear: thisYear.length,
      avgDays: counted ? Math.round(totalDays / counted * 10) / 10 : 0,
      bySubject: bySubject,
      year: year
    };
  }

  $('statsBtn').addEventListener('click', function () {
    var s = computeStats();
    var max = 1;
    Object.keys(s.bySubject).forEach(function (k) { if (s.bySubject[k] > max) max = s.bySubject[k]; });
    var html = '<div class="big-stats">' +
      '<div class="big-stat"><div class="v">' + s.thisYear + '</div><div class="k">' + s.year + '년 푼 권수</div></div>' +
      '<div class="big-stat"><div class="v">' + s.done + '</div><div class="k">전체 완료</div></div>' +
      '<div class="big-stat"><div class="v">' + (s.avgDays || '-') + '</div><div class="k">평균 소요 일수</div></div>' +
      '</div>';
    html += '<div class="section-head" style="margin-top:4px;"><h2>과목별 푼 권수</h2><span class="count">진행 중 ' + s.doing + '권</span></div>';
    var any = false;
    SUBJECTS.forEach(function (sub) {
      var n = s.bySubject[sub.name] || 0;
      if (!n) return;
      any = true;
      html += '<div class="bar-row">' +
        '<div class="bar-name">' + escapeHtml(sub.name) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + Math.round(n / max * 100) + '%;background:' + sub.color + '"></div></div>' +
        '<div class="bar-val">' + n + '권</div></div>';
    });
    if (!any) html += '<div class="empty-hint">아직 다 푼 문제집이 없어요.</div>';
    $('statsBody').innerHTML = html;
    openModal('statsModal');
  });

  // ---------- 공유 이미지 ----------
  function loadImg(src) {
    return new Promise(function (resolve) {
      if (!src) return resolve(null);
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { resolve(null); };
      img.src = src;
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  $('shareBtn').addEventListener('click', function () {
    var done = state.books.filter(function (b) { return b.endDate; })
      .sort(function (a, b) { return a.endDate < b.endDate ? 1 : -1; })
      .slice(0, 12);
    Promise.all(done.map(function (b) { return loadImg(b.cover); })).then(function (imgs) {
      var url = buildShareCanvas(done, imgs);
      $('shareImg').src = url;
      $('shareDownload').href = url;
      $('shareDownload').download = (state.profile ? state.profile.nickname : 'my') + '-workbook-shelf.png';
      openModal('shareModal');
    });
  });

  function buildShareCanvas(books, imgs) {
    var W = 1080, H = 1920;
    var canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');

    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#f7f3ea');
    grad.addColorStop(1, '#e8ddc8');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    var s = computeStats();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#2f2a24';
    ctx.font = 'bold 62px sans-serif';
    ctx.fillText((state.profile ? state.profile.nickname : '나') + '의 문제집 책장', W / 2, 150);
    ctx.fillStyle = '#8d8375';
    ctx.font = '36px sans-serif';
    ctx.fillText('다 푼 문제집 ' + s.done + '권 · ' + s.year + '년 ' + s.thisYear + '권 · 평균 ' + (s.avgDays || '-') + '일', W / 2, 212);

    // 책장 (한 줄 4권 × 3단)
    var PER_ROW = 4;
    var ROWS = Math.min(3, Math.max(2, Math.ceil(books.length / PER_ROW)));
    var marginX = 74, gap = 22;
    var coverW = Math.floor((W - marginX * 2 - gap * (PER_ROW - 1)) / PER_ROW);
    var coverH = Math.round(coverW * 1.5);
    var rowH = coverH + 52;
    // 책장 블록을 제목과 과목 칩 사이 밴드에 세로 중앙 정렬
    var bandTop = 270, bandH = 1230;
    var rowTop = bandTop + 26 + Math.round((bandH - (ROWS * rowH + 34)) / 2);

    // 책장 뒤판
    ctx.fillStyle = 'rgba(120, 88, 48, 0.10)';
    roundRect(ctx, marginX - 32, rowTop - 26, W - (marginX - 32) * 2, ROWS * rowH + 34, 18);
    ctx.fill();

    for (var r = 0; r < ROWS; r++) {
      var y = rowTop + r * rowH;
      var shelfY = y + coverH + 8;
      for (var c = 0; c < PER_ROW; c++) {
        var idx = r * PER_ROW + c;
        if (idx >= books.length) continue;
        var x = marginX + c * (coverW + gap);
        ctx.save();
        ctx.shadowColor = 'rgba(60,40,15,0.35)';
        ctx.shadowBlur = 14;
        ctx.shadowOffsetY = 7;
        roundRect(ctx, x, y, coverW, coverH, 7);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
        var img = imgs[idx];
        if (img) {
          ctx.save();
          roundRect(ctx, x, y, coverW, coverH, 7);
          ctx.clip();
          ctx.drawImage(img, x, y, coverW, coverH);
          ctx.restore();
        }
      }
      // 선반 나무판
      var wg = ctx.createLinearGradient(0, shelfY, 0, shelfY + 22);
      wg.addColorStop(0, '#c08f58');
      wg.addColorStop(0.6, '#96693a');
      wg.addColorStop(1, '#6f4d29');
      ctx.fillStyle = wg;
      roundRect(ctx, marginX - 24, shelfY, W - (marginX - 24) * 2, 22, 5);
      ctx.fill();
    }

    if (!books.length) {
      ctx.fillStyle = '#8d8375';
      ctx.font = '40px sans-serif';
      ctx.fillText('아직 진열된 문제집이 없어요', W / 2, rowTop + Math.round(rowH / 2));
    }

    // 과목별 요약
    var listY = 1580;
    ctx.textAlign = 'left';
    var parts = [];
    SUBJECTS.forEach(function (sub) {
      var n = s.bySubject[sub.name] || 0;
      if (n) parts.push({ name: sub.name, n: n, color: sub.color });
    });
    ctx.font = 'bold 34px sans-serif';
    var chips = parts.slice(0, 6).map(function (p) {
      return { label: p.name + ' ' + p.n, w: ctx.measureText(p.name + ' ' + p.n).width + 44, color: p.color };
    });
    var totalW = chips.reduce(function (acc, c) { return acc + c.w + 14; }, -14);
    var px = Math.max(marginX, Math.round((W - totalW) / 2));
    chips.forEach(function (c) {
      if (px + c.w > W - marginX + 20) return;
      ctx.fillStyle = c.color;
      roundRect(ctx, px, listY, c.w, 56, 28);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(c.label, px + 22, listY + 39);
      px += c.w + 14;
    });

    ctx.textAlign = 'center';
    ctx.fillStyle = '#9c917f';
    ctx.font = '28px sans-serif';
    ctx.fillText('문제집 책장 · ' + APP_URL, W / 2, H - 70);

    try { return canvas.toDataURL('image/png'); } catch (e) { return ''; }
  }

  // ---------- 설정 ----------
  $('settingsBtn').addEventListener('click', function () {
    if (!state.profile) { openModal('onboardModal'); return; }
    $('setNick').value = state.profile.nickname;
    fillSelect($('setGrade'), GRADES, state.profile.grade);
    $('setKakao').value = state.kakaoKey || '';
    showMsg('setMsg', '', '');
    openModal('settingsModal');
  });
  $('setSaveBtn').addEventListener('click', function () {
    var nick = $('setNick').value.trim();
    if (!nick) { showMsg('setMsg', '닉네임을 입력해 주세요.', 'error'); return; }
    state.profile.nickname = nick;
    state.profile.grade = $('setGrade').value;
    state.kakaoKey = $('setKakao').value.trim();
    saveState();
    render();
    showMsg('setMsg', '저장했어요.', 'success');
  });
  $('resetBtn').addEventListener('click', function () {
    if (!confirm('모든 문제집 기록이 사라져요. 정말 지울까요?')) return;
    localStorage.removeItem(STORAGE_KEY);
    state = { profile: null, books: [], kakaoKey: '' };
    closeModal('settingsModal');
    location.reload();
  });

  // ---------- 시작 ----------
  loadState();
  fillSelect($('fSubject'), SUBJECTS.map(function (x) { return x.name; }), '기타');
  fillSelect($('fGrade'), GRADE_OPTIONS, '중등 공통');
  if (!state.profile) {
    openModal('onboardModal');
  } else {
    render();
  }
})();
</script>
</body>
