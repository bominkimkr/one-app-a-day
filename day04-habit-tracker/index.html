<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>습관 체크</title>
<style>
  :root {
    --bg: #f3f7f4;
    --surface: #ffffff;
    --text: #24302a;
    --text-muted: #7c8b81;
    --accent: #2f9e6e;
    --accent-soft: #e1f3e9;
    --border: #e3ebe5;
    --danger: #c0392b;
    --shadow: 0 2px 10px rgba(30, 60, 45, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151b17;
      --surface: #1f2621;
      --text: #eaf1ec;
      --text-muted: #93a29a;
      --accent: #52c990;
      --accent-soft: #203129;
      --border: #2b342e;
      --danger: #e57373;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 17px; line-height: 1.5;
  }
  button { font-family: inherit; }
  #app { max-width: 520px; margin: 0 auto; min-height: 100vh; padding-bottom: 92px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 6px; }
  .topbar h1 { margin: 0; font-size: 19px; font-weight: 800; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 17px; cursor: pointer; }
  main { padding: 0 16px 24px; }
  .screen { display: none; }
  .screen.active { display: block; }

  .date-line { text-align: center; color: var(--text-muted); font-size: 13px; margin: 4px 0 14px; }

  .habit-card { background: var(--surface); border: 2px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .habit-card.checked { border-color: var(--accent); background: var(--accent-soft); }
  .habit-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .habit-card.checked .habit-check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .habit-info { flex: 1; min-width: 0; }
  .habit-name-row { display: flex; align-items: center; gap: 6px; }
  .habit-cat { font-size: 10.5px; background: var(--accent-soft); color: var(--accent); padding: 2px 7px; border-radius: 999px; font-weight: 700; }
  .habit-name { font-weight: 800; font-size: 15.5px; }
  .habit-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .habit-streak { font-size: 12px; font-weight: 800; color: var(--accent); white-space: nowrap; }
  .habit-edit-btn { background: none; border: none; font-size: 13px; color: var(--text-muted); cursor: pointer; padding: 4px; }

  .empty-hint { color: var(--text-muted); text-align: center; padding: 40px 16px; font-size: 14px; }
  .add-habit-btn { border: 2px dashed var(--border); background: none; border-radius: 16px; padding: 16px; width: 100%; color: var(--text-muted); font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 4px; }

  .btn { border: none; border-radius: 12px; padding: 13px 16px; font-size: 15px; font-weight: 800; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-outline { background: var(--surface); color: var(--text); border: 1px solid var(--border); width: 100%; }
  .action-row { display: flex; gap: 8px; margin: 16px 0; }
  .action-row .btn { flex: 1; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 15px; font-family: inherit;
  }
  .danger-link { display: block; text-align: center; color: var(--danger); font-size: 13.5px; margin-top: 12px; background: none; border: none; cursor: pointer; padding: 6px; width: 100%; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 25, 20, 0.5); z-index: 50; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg); width: 100%; max-width: 520px; max-height: 88vh; border-radius: 20px 20px 0 0; overflow-y: auto; animation: slideUp 0.2s ease; }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { position: sticky; top: 0; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 10px; border-bottom: 1px solid var(--border); }
  .modal-header h3 { margin: 0; font-size: 18px; }
  .close-btn { background: none; border: none; font-size: 20px; color: var(--text-muted); cursor: pointer; width: 40px; height: 40px; }
  .modal-body { padding: 16px 18px 28px; }

  .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; display: flex; background: var(--surface); border-top: 1px solid var(--border); padding: 6px 0 max(6px, env(safe-area-inset-bottom)); }
  .tab-btn { flex: 1; background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; padding: 8px 0; cursor: pointer; }
  .tab-btn.active { color: var(--accent); font-weight: 700; }
  .tab-btn .icon { font-size: 21px; }

  .celebrate-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 25, 20, 0.65); z-index: 100; align-items: center; justify-content: center; }
  .celebrate-overlay.open { display: flex; }
  .celebrate-content { background: var(--surface); border-radius: 20px; padding: 36px 28px; text-align: center; max-width: 320px; }
  .celebrate-emoji { font-size: 52px; }
  .celebrate-content p { font-size: 18px; font-weight: 800; margin: 14px 0 20px; }

  /* ---- Stats screen ---- */
  .month-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 6px 0 14px; }
  .month-nav h2 { margin: 0; font-size: 18px; min-width: 120px; text-align: center; }
  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; color: var(--text-muted); font-size: 12px; margin-bottom: 6px; }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 18px; }
  .month-cell, .month-cell-empty { aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 1px solid var(--border); }
  .month-cell-empty { visibility: hidden; }
  .stat-card { background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .stat-card h4 { margin: 0 0 10px; font-size: 14.5px; }
  .habit-stat-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .habit-stat-row:last-child { border-bottom: none; }
  .habit-stat-name { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .habit-stat-nums { text-align: right; color: var(--text-muted); font-size: 12px; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge-chip { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; }

  .share-card-img { width: 100%; border-radius: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 id="pageTitle">습관 체크</h1>
    <button class="icon-btn" id="manageBtn" title="습관 관리">⚙️</button>
  </div>
  <main>
    <section id="todayScreen" class="screen active">
      <p class="date-line" id="dateLine"></p>
      <div id="habitList"></div>
      <div class="action-row">
        <button class="btn btn-outline" id="shareTodayBtn">이미지 저장</button>
        <button class="btn btn-primary" id="submitDayBtn">오늘 제출하기</button>
      </div>
    </section>

    <section id="statsScreen" class="screen">
      <div class="month-nav">
        <button class="icon-btn" id="prevMonthBtn">‹</button>
        <h2 id="monthLabel"></h2>
        <button class="icon-btn" id="nextMonthBtn">›</button>
      </div>
      <div class="weekday-row"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div id="monthGrid" class="month-grid"></div>

      <div class="stat-card">
        <h4>습관별 통계</h4>
        <div id="habitStatsList"></div>
      </div>
      <div class="stat-card">
        <h4>뱃지</h4>
        <div class="badge-row" id="badgeRow"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-screen="todayScreen"><span class="icon">✅</span><span>오늘</span></button>
    <button class="tab-btn" data-screen="statsScreen"><span class="icon">📊</span><span>통계</span></button>
  </nav>
</div>

<div id="nameModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>반가워요 🌱</h3></div>
    <div class="modal-body">
      <div class="field"><label>이름을 알려주세요</label><input type="text" id="nameInput" placeholder="이름 또는 닉네임" maxlength="12"></div>
      <button class="btn btn-primary" id="nameSubmitBtn">시작하기</button>
    </div>
  </div>
</div>

<div id="habitModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3 id="habitModalTitle">습관 추가</h3><button class="close-btn" data-close="habitModal">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>습관 이름</label><input type="text" id="habitName" placeholder="예: 구몬 일본어"></div>
      <div class="field"><label>소요 시간 (분)</label><input type="number" id="habitDuration" min="5" step="5" placeholder="예: 10"></div>
      <div class="field"><label>빈도</label>
        <select id="habitFrequencyType">
          <option value="daily">매일</option>
          <option value="weekly">주 N회</option>
          <option value="monthly">월 N회</option>
        </select>
      </div>
      <div class="field" id="frequencyCountField" style="display:none;">
        <label>주/월 몇 회</label><input type="number" id="habitFrequencyCount" min="1" max="30" placeholder="예: 3">
      </div>
      <div class="field"><label>기간</label>
        <select id="habitPeriodScope">
          <option value="week">한 주</option>
          <option value="month">한 달</option>
          <option value="year">1년 내내</option>
        </select>
      </div>
      <button class="btn btn-primary" id="habitSaveBtn">저장하기</button>
      <button class="danger-link" id="habitDeleteBtn" style="display:none;">이 습관 삭제하기</button>
    </div>
  </div>
</div>

<div id="manageModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>습관 관리</h3><button class="close-btn" data-close="manageModal">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>이름</label><input type="text" id="settingsNameInput"></div>
      <button class="btn btn-outline" id="settingsSaveNameBtn" style="margin-bottom:16px;">이름 저장</button>
      <div id="manageHabitList"></div>
      <button class="add-habit-btn" id="manageAddHabitBtn">＋ 습관 추가 (최대 10개)</button>
    </div>
  </div>
</div>

<div id="shareModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>오늘의 습관 카드</h3><button class="close-btn" data-close="shareModal">✕</button></div>
    <div class="modal-body">
      <img class="share-card-img" id="shareCardImg" alt="습관 카드 미리보기">
      <a class="btn btn-primary" id="shareCardDownloadBtn" download="habit-check.png" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;">이미지 저장하기</a>
    </div>
  </div>
</div>

<div id="celebrateOverlay" class="celebrate-overlay">
  <div class="celebrate-content">
    <div class="celebrate-emoji">🎉</div>
    <p id="celebrateText"></p>
    <button id="celebrateCloseBtn" class="btn btn-primary">확인</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEYS = { username: 'hb_username', habits: 'hb_habits', checks: 'hb_checks', badges: 'hb_badges' };
  var WEEKDAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
  var COLOR_PALETTE = ['#2f9e6e','#e08a3d','#4c8bf5','#d1568c','#8a5cf6','#2bb3b3','#c99a2e','#5a9e3d','#e0555a','#3d7fa6'];

  var CATEGORIES = [
    { id: 'study', label: '공부', keywords: ['영어','수학','국어','과학','사회','공부','학원','인강','단어','문법','한자','일본어','중국어','구몬','신문','독해','과제','숙제'] },
    { id: 'exercise', label: '운동', keywords: ['운동','헬스','러닝','요가','스트레칭','걷기','수영','축구','농구','필라테스'] },
    { id: 'content', label: '콘텐츠', keywords: ['인스타','유튜브','블로그','콘텐츠','촬영','편집','업로드','sns','틱톡'] },
    { id: 'mindcare', label: '마음돌봄', keywords: ['명상','일기','감사','수면','독서','책','플래너','다이어리'] },
    { id: 'default', label: '자기관리', keywords: [] }
  ];
  var CATEGORY_MAP = {};
  CATEGORIES.forEach(function (c) { CATEGORY_MAP[c.id] = c; });

  var state = {
    habits: [],
    checks: {},
    badges: [],
    monthYear: null,
    monthIndex: null,
    editingHabitId: null
  };

  function loadState() {
    try { state.habits = JSON.parse(localStorage.getItem(STORAGE_KEYS.habits) || '[]'); } catch (e) { state.habits = []; }
    try { state.checks = JSON.parse(localStorage.getItem(STORAGE_KEYS.checks) || '{}'); } catch (e) { state.checks = {}; }
    try { state.badges = JSON.parse(localStorage.getItem(STORAGE_KEYS.badges) || '[]'); } catch (e) { state.badges = []; }
  }
  function saveHabits() { localStorage.setItem(STORAGE_KEYS.habits, JSON.stringify(state.habits)); }
  function saveChecks() { localStorage.setItem(STORAGE_KEYS.checks, JSON.stringify(state.checks)); }
  function saveBadges() { localStorage.setItem(STORAGE_KEYS.badges, JSON.stringify(state.badges)); }
  function getUsername() { return localStorage.getItem(STORAGE_KEYS.username) || ''; }
  function setUsername(n) { localStorage.setItem(STORAGE_KEYS.username, n); }

  function pad2(n) { return String(n).padStart(2, '0'); }
  function dateKeyFromDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayKey() { return dateKeyFromDate(new Date()); }
  function addDaysStr(key, delta) { var d = new Date(key + 'T00:00:00'); d.setDate(d.getDate() + delta); return dateKeyFromDate(d); }
  function addMonthsStr(key, delta) { var d = new Date(key + 'T00:00:00'); d.setMonth(d.getMonth() + delta); return dateKeyFromDate(d); }
  function weekKeyForDate(key) { var d = new Date(key + 'T00:00:00'); d.setDate(d.getDate() - d.getDay()); return dateKeyFromDate(d); }
  function monthKeyForDate(key) { return key.slice(0, 7); }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function generateId(p) { return p + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

  function detectCategory(name) {
    var text = (name || '').toLowerCase();
    for (var i = 0; i < CATEGORIES.length; i++) {
      if (CATEGORIES[i].id === 'default') continue;
      for (var j = 0; j < CATEGORIES[i].keywords.length; j++) {
        if (text.indexOf(CATEGORIES[i].keywords[j].toLowerCase()) !== -1) return CATEGORIES[i];
      }
    }
    return CATEGORY_MAP.default;
  }

  function habitEndDate(habit) {
    if (habit.periodScope === 'week') return addDaysStr(habit.startDate, 6);
    if (habit.periodScope === 'month') return addDaysStr(addMonthsStr(habit.startDate, 1), -1);
    return null;
  }
  function isHabitActiveOn(habit, dateKey) {
    if (dateKey < habit.startDate) return false;
    var end = habitEndDate(habit);
    if (end && dateKey > end) return false;
    return true;
  }
  function activeHabitsOn(dateKey) {
    return state.habits.filter(function (h) { return isHabitActiveOn(h, dateKey); });
  }
  function isChecked(dateKey, habitId) {
    return !!(state.checks[dateKey] && state.checks[dateKey][habitId]);
  }
  function setChecked(dateKey, habitId, val) {
    if (!state.checks[dateKey]) state.checks[dateKey] = {};
    if (val) state.checks[dateKey][habitId] = true;
    else delete state.checks[dateKey][habitId];
    saveChecks();
  }

  // ---------- Streak logic ----------
  function weekHasAnyCheck(habit, weekKey, excludeDate) {
    var cur = weekKey, end = addDaysStr(weekKey, 6);
    while (cur <= end) {
      if (cur !== excludeDate && isChecked(cur, habit.id)) return true;
      cur = addDaysStr(cur, 1);
    }
    return false;
  }
  function computeDailyStreak(habit) {
    var cursor = todayKey();
    var streak = 0;
    var weekUsed = {};
    // Today is still in progress: count it if already checked, but don't spend
    // its week's exemption on it (that would grant a free streak day for a day
    // that hasn't happened yet).
    if (isChecked(cursor, habit.id)) streak++;
    cursor = addDaysStr(cursor, -1);
    while (cursor >= habit.startDate) {
      var wk = weekKeyForDate(cursor);
      if (isChecked(cursor, habit.id)) {
        streak++;
      } else if (!weekUsed[wk] && weekHasAnyCheck(habit, wk, cursor)) {
        // Only forgive a miss in a week where the habit was otherwise
        // actually kept -- an entirely inactive week shouldn't extend a streak.
        weekUsed[wk] = true;
        streak++;
      } else {
        break;
      }
      cursor = addDaysStr(cursor, -1);
    }
    return streak;
  }
  function bucketKeyForType(habit, dateKey) {
    return habit.frequencyType === 'monthly' ? monthKeyForDate(dateKey) : weekKeyForDate(dateKey);
  }
  function bucketRange(habit, bucketKey) {
    if (habit.frequencyType === 'monthly') {
      var start = bucketKey + '-01';
      var end = addDaysStr(addMonthsStr(start, 1), -1);
      return { start: start, end: end };
    }
    return { start: bucketKey, end: addDaysStr(bucketKey, 6) };
  }
  function bucketActualCount(habit, bucketKey) {
    var range = bucketRange(habit, bucketKey);
    var count = 0;
    var cursor = range.start;
    while (cursor <= range.end) {
      if (isChecked(cursor, habit.id)) count++;
      cursor = addDaysStr(cursor, 1);
    }
    return count;
  }
  function bucketRequiredCount(habit) { return habit.frequencyCount || 1; }
  function bucketSuccess(habit, bucketKey) {
    var actual = bucketActualCount(habit, bucketKey);
    var required = bucketRequiredCount(habit);
    return actual >= required || actual >= required - 1;
  }
  function computeBucketStreak(habit) {
    var cursor = bucketKeyForType(habit, addDaysStr(todayKey(), habit.frequencyType === 'monthly' ? -32 : -7));
    // Walk buckets from a safe past point forward isn't simple backward; instead walk backward from previous fully-elapsed bucket.
    var todayBucket = bucketKeyForType(habit, todayKey());
    var prevKey = habit.frequencyType === 'monthly' ? addMonthsStr(todayBucket + '-01', -1).slice(0, 7) : addDaysStr(todayBucket, -7);
    var streak = 0;
    var bk = prevKey;
    while (bucketRange(habit, bk).start >= habit.startDate || bk === prevKey) {
      if (bucketRange(habit, bk).end < habit.startDate) break;
      if (!bucketSuccess(habit, bk)) break;
      streak++;
      bk = habit.frequencyType === 'monthly' ? addMonthsStr(bk + '-01', -1).slice(0, 7) : addDaysStr(bk, -7);
      if (streak > 520) break;
    }
    return streak;
  }
  function computeHabitStreak(habit) {
    return habit.frequencyType === 'daily' ? computeDailyStreak(habit) : computeBucketStreak(habit);
  }

  // ---------- Onboarding ----------
  function ensureUsername() { if (!getUsername()) openModal('nameModal'); }
  function updatePageTitle() { document.getElementById('pageTitle').textContent = (getUsername() || '나') + '의 습관 체크'; }
  document.getElementById('nameSubmitBtn').addEventListener('click', function () {
    var v = document.getElementById('nameInput').value.trim();
    if (!v) { document.getElementById('nameInput').focus(); return; }
    setUsername(v); closeModal('nameModal'); updatePageTitle();
  });

  // ---------- Modal helpers ----------
  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', function () { closeModal(b.dataset.close); }); });
  document.querySelectorAll('.modal-overlay').forEach(function (o) {
    o.addEventListener('click', function (e) { if (o.id === 'nameModal') return; if (e.target === o) o.classList.remove('open'); });
  });

  // ---------- Tabs ----------
  document.querySelectorAll('.tab-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.toggle('active', s.id === b.dataset.screen); });
      document.querySelectorAll('.tab-btn').forEach(function (t) { t.classList.toggle('active', t === b); });
      if (b.dataset.screen === 'statsScreen') renderStats();
    });
  });

  // ---------- Habit modal ----------
  document.getElementById('habitFrequencyType').addEventListener('change', function () {
    document.getElementById('frequencyCountField').style.display = this.value === 'daily' ? 'none' : 'block';
  });
  function openAddHabitModal() {
    if (state.habits.length >= 10) { showCelebration('습관은 최대 10개까지 등록할 수 있어요.'); return; }
    state.editingHabitId = null;
    document.getElementById('habitModalTitle').textContent = '습관 추가';
    document.getElementById('habitName').value = '';
    document.getElementById('habitDuration').value = '';
    document.getElementById('habitFrequencyType').value = 'daily';
    document.getElementById('frequencyCountField').style.display = 'none';
    document.getElementById('habitFrequencyCount').value = '';
    document.getElementById('habitPeriodScope').value = 'year';
    document.getElementById('habitDeleteBtn').style.display = 'none';
    openModal('habitModal');
  }
  function openEditHabitModal(id) {
    var h = state.habits.filter(function (x) { return x.id === id; })[0];
    if (!h) return;
    state.editingHabitId = id;
    document.getElementById('habitModalTitle').textContent = '습관 수정';
    document.getElementById('habitName').value = h.name;
    document.getElementById('habitDuration').value = h.durationMinutes;
    document.getElementById('habitFrequencyType').value = h.frequencyType;
    document.getElementById('frequencyCountField').style.display = h.frequencyType === 'daily' ? 'none' : 'block';
    document.getElementById('habitFrequencyCount').value = h.frequencyCount || '';
    document.getElementById('habitPeriodScope').value = h.periodScope;
    document.getElementById('habitDeleteBtn').style.display = 'block';
    openModal('habitModal');
  }
  document.getElementById('habitSaveBtn').addEventListener('click', function () {
    var name = document.getElementById('habitName').value.trim();
    if (!name) { document.getElementById('habitName').focus(); return; }
    var duration = parseInt(document.getElementById('habitDuration').value, 10) || 10;
    var freqType = document.getElementById('habitFrequencyType').value;
    var freqCount = freqType === 'daily' ? null : (parseInt(document.getElementById('habitFrequencyCount').value, 10) || 1);
    var periodScope = document.getElementById('habitPeriodScope').value;
    var category = detectCategory(name);
    if (state.editingHabitId) {
      var h = state.habits.filter(function (x) { return x.id === state.editingHabitId; })[0];
      if (h) { h.name = name; h.durationMinutes = duration; h.frequencyType = freqType; h.frequencyCount = freqCount; h.periodScope = periodScope; h.category = category.id; }
    } else {
      var usedColors = state.habits.map(function (x) { return x.color; });
      var color = COLOR_PALETTE[state.habits.length % COLOR_PALETTE.length];
      state.habits.push({
        id: generateId('habit'), name: name, category: category.id, color: color,
        durationMinutes: duration, frequencyType: freqType, frequencyCount: freqCount,
        periodScope: periodScope, startDate: todayKey()
      });
    }
    saveHabits();
    closeModal('habitModal');
    renderToday();
    renderManageList();
  });
  document.getElementById('habitDeleteBtn').addEventListener('click', function () {
    state.habits = state.habits.filter(function (x) { return x.id !== state.editingHabitId; });
    saveHabits();
    closeModal('habitModal');
    renderToday();
    renderManageList();
  });

  // ---------- Manage screen ----------
  document.getElementById('manageBtn').addEventListener('click', function () {
    document.getElementById('settingsNameInput').value = getUsername();
    renderManageList();
    openModal('manageModal');
  });
  document.getElementById('settingsSaveNameBtn').addEventListener('click', function () {
    var v = document.getElementById('settingsNameInput').value.trim();
    if (v) { setUsername(v); updatePageTitle(); }
  });
  document.getElementById('manageAddHabitBtn').addEventListener('click', openAddHabitModal);
  function renderManageList() {
    var wrap = document.getElementById('manageHabitList');
    if (!state.habits.length) { wrap.innerHTML = '<p class="empty-hint">아직 등록된 습관이 없어요.</p>'; return; }
    wrap.innerHTML = state.habits.map(function (h) {
      var cat = CATEGORY_MAP[h.category] || CATEGORY_MAP.default;
      var freqLabel = h.frequencyType === 'daily' ? '매일' : (h.frequencyType === 'weekly' ? '주 ' + h.frequencyCount + '회' : '월 ' + h.frequencyCount + '회');
      return '<div class="habit-card" data-manage-edit="' + h.id + '" style="cursor:pointer;">' +
        '<span class="dot" style="background:' + h.color + ';"></span>' +
        '<div class="habit-info"><div class="habit-name-row"><span class="habit-name">' + escapeHtml(h.name) + '</span><span class="habit-cat">' + cat.label + '</span></div>' +
        '<div class="habit-meta">' + freqLabel + ' · ' + h.durationMinutes + '분</div></div>' +
        '<span class="habit-edit-btn">✏️</span></div>';
    }).join('');
    wrap.querySelectorAll('[data-manage-edit]').forEach(function (el) {
      el.addEventListener('click', function () { openEditHabitModal(el.dataset.manageEdit); });
    });
  }

  // ---------- Today screen ----------
  function renderToday() {
    var t = todayKey();
    var d = new Date();
    document.getElementById('dateLine').textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEKDAY_NAMES[d.getDay()] + ')';
    var habits = activeHabitsOn(t);
    var list = document.getElementById('habitList');
    if (!habits.length) {
      list.innerHTML = '<p class="empty-hint">아직 등록된 습관이 없어요.<br>설정에서 습관을 추가해보세요!</p><button class="add-habit-btn" id="emptyAddHabitBtn">＋ 습관 추가</button>';
      document.getElementById('emptyAddHabitBtn').addEventListener('click', openAddHabitModal);
      return;
    }
    list.innerHTML = habits.map(function (h) {
      var checked = isChecked(t, h.id);
      var cat = CATEGORY_MAP[h.category] || CATEGORY_MAP.default;
      var streak = computeHabitStreak(h);
      var freqLabel = h.frequencyType === 'daily' ? '매일 ' + h.durationMinutes + '분' : (h.frequencyType === 'weekly' ? '주 ' + h.frequencyCount + '회 · ' + h.durationMinutes + '분' : '월 ' + h.frequencyCount + '회 · ' + h.durationMinutes + '분');
      return '<div class="habit-card' + (checked ? ' checked' : '') + '" data-habit="' + h.id + '">' +
        '<span class="habit-check">' + (checked ? '✓' : '') + '</span>' +
        '<div class="habit-info"><div class="habit-name-row"><span class="habit-name">' + escapeHtml(h.name) + '</span><span class="habit-cat">' + cat.label + '</span></div>' +
        '<div class="habit-meta">' + freqLabel + '</div></div>' +
        '<span class="habit-streak">🔥 ' + streak + '</span>' +
        '</div>';
    }).join('');
    list.querySelectorAll('.habit-card').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.dataset.habit;
        setChecked(t, id, !isChecked(t, id));
        renderToday();
      });
    });
  }

  document.getElementById('submitDayBtn').addEventListener('click', function () {
    var t = todayKey();
    var habits = activeHabitsOn(t);
    if (!habits.length) { showCelebration('오늘 등록된 습관이 없어요.'); return; }
    var allChecked = habits.every(function (h) { return isChecked(t, h.id); });
    checkAndAwardBadges(t);
    if (allChecked) {
      showCelebration('🎉 오늘의 습관을 모두 완료했어요!');
    } else {
      var doneCount = habits.filter(function (h) { return isChecked(t, h.id); }).length;
      showCelebration('오늘 ' + doneCount + '/' + habits.length + '개 완료했어요. 내일도 힘내요!');
    }
  });

  function weekFullySuccessful(weekKey) {
    var range = bucketRange({ frequencyType: 'weekly' }, weekKey);
    var habitsInvolved = state.habits.filter(function (h) { return isHabitActiveOn(h, range.start) || isHabitActiveOn(h, range.end); });
    if (!habitsInvolved.length) return false;
    return habitsInvolved.every(function (h) {
      if (h.frequencyType === 'daily') {
        var cnt = 0, cur = range.start;
        while (cur <= range.end) { if (isChecked(cur, h.id)) cnt++; cur = addDaysStr(cur, 1); }
        return cnt >= 6;
      }
      return bucketSuccess(h, weekKeyForDate(range.start));
    });
  }
  function monthFullySuccessful(monthKey) {
    var habitsInvolved = state.habits.filter(function (h) { return monthKeyForDate(h.startDate) <= monthKey; });
    if (!habitsInvolved.length) return false;
    return habitsInvolved.every(function (h) {
      if (h.frequencyType === 'monthly') return bucketSuccess(h, monthKey);
      var range = { start: monthKey + '-01', end: addDaysStr(addMonthsStr(monthKey + '-01', 1), -1) };
      var cnt = 0, cur = range.start;
      while (cur <= range.end) { if (isChecked(cur, h.id)) cnt++; cur = addDaysStr(cur, 1); }
      var totalDays = 0; cur = range.start;
      while (cur <= range.end) { totalDays++; cur = addDaysStr(cur, 1); }
      return cnt >= totalDays - 4;
    });
  }
  function checkAndAwardBadges(dateKey) {
    var wk = 'week:' + weekKeyForDate(dateKey);
    var mk = 'month:' + monthKeyForDate(dateKey);
    if (state.badges.indexOf(wk) === -1 && weekFullySuccessful(weekKeyForDate(dateKey))) { state.badges.push(wk); saveBadges(); }
    if (state.badges.indexOf(mk) === -1 && monthFullySuccessful(monthKeyForDate(dateKey))) { state.badges.push(mk); saveBadges(); }
  }

  var celebrateOverlay = document.getElementById('celebrateOverlay');
  document.getElementById('celebrateCloseBtn').addEventListener('click', function () { celebrateOverlay.classList.remove('open'); });
  function showCelebration(msg) {
    document.getElementById('celebrateText').textContent = msg;
    celebrateOverlay.classList.add('open');
  }

  // ---------- Stats screen ----------
  document.getElementById('prevMonthBtn').addEventListener('click', function () { state.monthIndex--; if (state.monthIndex < 0) { state.monthIndex = 11; state.monthYear--; } renderStats(); });
  document.getElementById('nextMonthBtn').addEventListener('click', function () { state.monthIndex++; if (state.monthIndex > 11) { state.monthIndex = 0; state.monthYear++; } renderStats(); });

  function renderStats() {
    if (state.monthYear == null) { var n = new Date(); state.monthYear = n.getFullYear(); state.monthIndex = n.getMonth(); }
    document.getElementById('monthLabel').textContent = state.monthYear + '년 ' + (state.monthIndex + 1) + '월';
    var grid = document.getElementById('monthGrid');
    grid.innerHTML = '';
    var firstDay = new Date(state.monthYear, state.monthIndex, 1).getDay();
    var daysInMonth = new Date(state.monthYear, state.monthIndex + 1, 0).getDate();
    var frag = document.createDocumentFragment();
    for (var i = 0; i < firstDay; i++) { var e = document.createElement('div'); e.className = 'month-cell-empty'; frag.appendChild(e); }
    for (var dd = 1; dd <= daysInMonth; dd++) {
      var key = state.monthYear + '-' + pad2(state.monthIndex + 1) + '-' + pad2(dd);
      var habitsThatDay = activeHabitsOn(key);
      var cell = document.createElement('div');
      cell.className = 'month-cell';
      if (habitsThatDay.length && key <= todayKey()) {
        var doneCount = habitsThatDay.filter(function (h) { return isChecked(key, h.id); }).length;
        var ratio = doneCount / habitsThatDay.length;
        cell.style.background = 'color-mix(in srgb, var(--accent) ' + Math.round(10 + ratio * 80) + '%, var(--surface))';
      }
      cell.textContent = dd;
      frag.appendChild(cell);
    }
    grid.appendChild(frag);

    var statsList = document.getElementById('habitStatsList');
    if (!state.habits.length) {
      statsList.innerHTML = '<p class="empty-hint">등록된 습관이 없어요.</p>';
    } else {
      var monthPrefix = state.monthYear + '-' + pad2(state.monthIndex + 1) + '-';
      statsList.innerHTML = state.habits.map(function (h) {
        var checkedThisMonth = 0, totalCumulative = 0;
        Object.keys(state.checks).forEach(function (k) {
          if (state.checks[k][h.id]) {
            totalCumulative += h.durationMinutes;
            if (k.indexOf(monthPrefix) === 0) checkedThisMonth++;
          }
        });
        var daysElapsedThisMonth = Math.min(daysInMonth, (state.monthYear === new Date().getFullYear() && state.monthIndex === new Date().getMonth()) ? new Date().getDate() : daysInMonth);
        var pct = daysElapsedThisMonth > 0 ? Math.round((checkedThisMonth / daysElapsedThisMonth) * 100) : 0;
        var streak = computeHabitStreak(h);
        var hours = Math.floor(totalCumulative / 60), mins = totalCumulative % 60;
        return '<div class="habit-stat-row"><span class="habit-stat-name"><span class="dot" style="background:' + h.color + ';"></span>' + escapeHtml(h.name) + '</span>' +
          '<span class="habit-stat-nums">이번달 ' + pct + '% · 최장 ' + streak + '일<br>누적 ' + (hours > 0 ? hours + '시간 ' : '') + mins + '분</span></div>';
      }).join('');
    }

    var badgeRow = document.getElementById('badgeRow');
    if (!state.badges.length) {
      badgeRow.innerHTML = '<p class="empty-hint">아직 획득한 뱃지가 없어요.</p>';
    } else {
      badgeRow.innerHTML = state.badges.slice().reverse().map(function (b) {
        var parts = b.split(':');
        var label = parts[0] === 'week' ? parts[1] + ' 주간 완주' : parts[1] + ' 월간 완주';
        return '<span class="badge-chip">🏅 ' + label + '</span>';
      }).join('');
    }
  }

  // ---------- Share card ----------
  function wrapCanvasText(ctx, text, maxWidth) {
    var lines = [], current = '';
    for (var i = 0; i < text.length; i++) {
      var test = current + text[i];
      if (ctx.measureText(test).width > maxWidth && current) { lines.push(current); current = text[i]; } else current = test;
    }
    if (current) lines.push(current);
    return lines;
  }
  document.getElementById('shareTodayBtn').addEventListener('click', function () {
    var t = todayKey();
    var habits = activeHabitsOn(t);
    var canvas = document.createElement('canvas');
    canvas.width = 1080; canvas.height = 1920;
    var ctx = canvas.getContext('2d');
    var styles = getComputedStyle(document.documentElement);
    var bg = (styles.getPropertyValue('--bg') || '#f3f7f4').trim();
    var accent = (styles.getPropertyValue('--accent') || '#2f9e6e').trim();
    var text = (styles.getPropertyValue('--text') || '#24302a').trim();
    var textMuted = (styles.getPropertyValue('--text-muted') || '#7c8b81').trim();

    ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = accent;
    ctx.font = 'bold 46px sans-serif';
    ctx.fillText('🌱 ' + (getUsername() || '나') + '의 습관 체크', 540, 150);
    var d = new Date();
    ctx.fillStyle = textMuted; ctx.font = '34px sans-serif';
    ctx.fillText((d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEKDAY_NAMES[d.getDay()] + ')', 540, 205);

    var doneCount = habits.filter(function (h) { return isChecked(t, h.id); }).length;
    ctx.fillStyle = text; ctx.font = 'bold 100px sans-serif';
    ctx.fillText(doneCount + ' / ' + habits.length, 540, 380);
    ctx.font = '32px sans-serif'; ctx.fillStyle = textMuted;
    ctx.fillText('오늘 완료한 습관', 540, 430);

    var y = 540;
    ctx.textAlign = 'left';
    habits.slice(0, 10).forEach(function (h) {
      var checked = isChecked(t, h.id);
      ctx.fillStyle = checked ? h.color : '#cccccc';
      ctx.beginPath(); ctx.arc(120, y - 12, 18, 0, Math.PI * 2); ctx.fill();
      if (checked) { ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('✓', 120, y - 4); ctx.textAlign = 'left'; }
      ctx.fillStyle = text; ctx.font = 'bold 34px sans-serif';
      var lines = wrapCanvasText(ctx, h.name, 700);
      ctx.fillText(lines[0] || h.name, 170, y);
      y += 80;
    });

    ctx.textAlign = 'center'; ctx.fillStyle = textMuted; ctx.font = '26px sans-serif';
    ctx.fillText('습관 체크 · one-app-a-day', 540, 1860);

    var dataUrl = canvas.toDataURL('image/png');
    document.getElementById('shareCardImg').src = dataUrl;
    document.getElementById('shareCardDownloadBtn').href = dataUrl;
    document.getElementById('shareCardDownloadBtn').download = 'habit-check-' + t + '.png';
    openModal('shareModal');
  });

  // ---------- Init ----------
  loadState();
  updatePageTitle();
  renderToday();
  ensureUsername();
})();
</script>
</body>
</html>
