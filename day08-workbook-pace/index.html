<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>문제집 하루 분량</title>
<style>
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --text: #26241f;
    --text-muted: #857e70;
    --accent: #1f7a5a;
    --accent-2: #12634a;
    --accent-soft: #dff0e8;
    --warn: #c9700f;
    --warn-soft: #fbeeda;
    --border: #e2ddd1;
    --danger: #c0453a;
    --shadow: 0 2px 10px rgba(50, 45, 25, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141715;
      --surface: #1e2320;
      --text: #eef1ec;
      --text-muted: #9ba393;
      --accent: #4cc79a;
      --accent-2: #6fd9b1;
      --accent-soft: #1d3730;
      --warn: #e8a44c;
      --warn-soft: #3a2e1a;
      --border: #2f3630;
      --danger: #e57a6f;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 17px; line-height: 1.55;
  }
  button, input, select, textarea { font-family: inherit; }
  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: 110px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 20px 16px 6px; }
  .topbar h1 { margin: 0; font-size: 19px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 16px; cursor: pointer; flex-shrink: 0; }
  main { padding: 0 16px; }

  .today-line { padding: 0 18px 10px; font-size: 13px; color: var(--text-muted); }
  .streak-badge { display: inline-block; background: var(--warn-soft); color: var(--warn); font-weight: 800; font-size: 12px; padding: 3px 10px; border-radius: 999px; margin-left: 4px; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 16px 2px 10px; }
  .section-head h2 { margin: 0; font-size: 15px; font-weight: 800; }
  .section-head .count { font-size: 12.5px; color: var(--text-muted); }

  /* 오늘 카드 */
  .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .task-card.done { border-color: var(--accent); background: var(--accent-soft); }
  .task-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
  .task-cover { width: 52px; height: 78px; border-radius: 4px; overflow: hidden; flex-shrink: 0; background: var(--accent-soft); box-shadow: 1px 2px 6px rgba(40,35,15,0.2); cursor: pointer; }
  .task-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .task-meta { flex: 1; min-width: 0; }
  .task-title { font-size: 15px; font-weight: 800; line-height: 1.3; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .task-sub { font-size: 11.5px; color: var(--text-muted); }
  .range { text-align: center; padding: 6px 0 12px; }
  .range .big { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; }
  .range .amount { font-size: 13.5px; color: var(--accent); font-weight: 800; margin-top: 2px; }
  .range .alldone { font-size: 22px; font-weight: 800; color: var(--accent); }

  .progress { height: 10px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; margin-bottom: 6px; }
  .progress > div { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s ease; }
  .progress-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-muted); margin-bottom: 12px; }

  .alert { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; font-weight: 700; line-height: 1.55; margin-bottom: 12px; }
  .alert.ok { background: var(--accent-soft); color: var(--accent-2); }

  .btn { border: none; border-radius: 12px; padding: 13px 16px; font-size: 15px; font-weight: 800; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-outline { background: var(--surface); color: var(--text); border: 1px solid var(--border); width: 100%; }
  .btn-sm { padding: 10px 12px; font-size: 13.5px; }
  .row-btns { display: flex; gap: 8px; }
  .row-btns .btn { flex: 1; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 700; cursor: pointer; padding: 8px 2px; width: 100%; }
  .danger-link { display: block; text-align: center; color: var(--danger); font-size: 13.5px; margin-top: 10px; background: none; border: none; cursor: pointer; padding: 8px; width: 100%; }

  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 30; width: min(528px, calc(100% - 32px)); background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 15px; font-size: 16px; font-weight: 800; box-shadow: 0 6px 20px rgba(20, 90, 65, 0.35); cursor: pointer; }

  .done-card { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 11px 13px; margin-bottom: 9px; cursor: pointer; }
  .done-card .task-cover { width: 40px; height: 60px; }
  .done-card .dc-title { font-size: 14px; font-weight: 800; line-height: 1.3; }
  .done-card .dc-sub { font-size: 11.5px; color: var(--text-muted); }
  .shelf-tag { font-size: 10.5px; background: var(--accent-soft); color: var(--accent-2); padding: 2px 8px; border-radius: 999px; font-weight: 800; display: inline-block; margin-top: 3px; }

  .empty-hint { color: var(--text-muted); text-align: center; padding: 34px 16px; font-size: 14px; line-height: 1.7; }

  /* 폼 */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; font-weight: 700; }
  .field input, .field select {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 15px;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .search-row { display: flex; gap: 8px; }
  .search-row input { flex: 1; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; }
  .search-row button { flex: 0 0 auto; padding: 0 16px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-weight: 800; cursor: pointer; }
  .form-msg { font-size: 13px; margin: 8px 0 0; color: var(--text-muted); min-height: 18px; line-height: 1.5; }
  .form-msg.error { color: var(--danger); }
  .form-msg.success { color: var(--accent-2); }

  .result-list { margin-top: 10px; max-height: 240px; overflow-y: auto; }
  .result-item { display: flex; gap: 10px; align-items: center; padding: 9px; border: 1px solid var(--border); border-radius: 11px; margin-bottom: 7px; background: var(--surface); cursor: pointer; }
  .result-item img, .result-item .noimg { width: 38px; height: 54px; object-fit: cover; border-radius: 4px; background: var(--accent-soft); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .result-item .ri-title { font-size: 14px; font-weight: 700; line-height: 1.35; }
  .result-item .ri-sub { font-size: 11.5px; color: var(--text-muted); }

  .cover-picker { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  .cover-preview { width: 78px; height: 117px; border-radius: 6px; overflow: hidden; background: var(--accent-soft); border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
  .cover-picker-btns { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .cover-picker-btns .btn { padding: 10px; font-size: 13.5px; }
  .cover-hint { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; }

  .tabs { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
  .tabs button { flex: 1; border: none; background: none; color: var(--text-muted); font-size: 13.5px; font-weight: 800; padding: 9px 4px; border-radius: 9px; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: #fff; }

  .preview-box { background: var(--accent-soft); border-radius: 12px; padding: 13px 14px; font-size: 13.5px; font-weight: 700; color: var(--accent-2); line-height: 1.6; margin-bottom: 14px; }

  .log-list { max-height: 190px; overflow-y: auto; margin-top: 6px; }
  .log-row { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 2px; border-bottom: 1px solid var(--border); }
  .log-row .lp { color: var(--text-muted); }

  .stat-strip { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
  .stat-cell { flex: 1; text-align: center; padding: 12px 4px; border-right: 1px solid var(--border); }
  .stat-cell:last-child { border-right: none; }
  .stat-cell .v { font-size: 17px; font-weight: 800; }
  .stat-cell .k { font-size: 11px; color: var(--text-muted); }

  /* 모달 */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(25, 30, 22, 0.5); z-index: 50; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; border-radius: 20px 20px 0 0; overflow-y: auto; animation: slideUp 0.2s ease; }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { position: sticky; top: 0; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 10px; border-bottom: 1px solid var(--border); z-index: 2; }
  .modal-header h3 { margin: 0; font-size: 18px; }
  .close-btn { background: none; border: none; font-size: 20px; color: var(--text-muted); cursor: pointer; width: 40px; height: 40px; }
  .modal-body { padding: 16px 18px 28px; }

  .share-img { width: 100%; border-radius: 14px; margin-bottom: 14px; box-shadow: var(--shadow); display: block; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; display: none; }
  #confetti.on { display: block; }
  .conf { position: absolute; font-size: 22px; animation: fall linear forwards; }
  @keyframes fall { from { transform: translateY(-60px) rotate(0deg); opacity: 1; } to { transform: translateY(105vh) rotate(540deg); opacity: 0.9; } }
  .cheer { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 95; width: min(320px, 86vw); background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; text-align: center; box-shadow: 0 10px 34px rgba(30,40,20,0.28); display: none; animation: pop 0.25s ease; }
  .cheer.on { display: block; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .cheer .emo { font-size: 40px; }
  .cheer .msg { font-size: 18px; font-weight: 800; margin-top: 6px; }
  .cheer .sub { font-size: 13px; color: var(--text-muted); margin-top: 5px; line-height: 1.6; }
  .cheer .shelf-note { font-size: 12.5px; color: var(--accent-2); font-weight: 800; margin-top: 10px; background: var(--accent-soft); border-radius: 10px; padding: 8px; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 id="pageTitle">문제집 하루 분량</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="shareBtn" title="오늘 분량 카드">📤</button>
      <button class="icon-btn" id="settingsBtn" title="설정">⚙️</button>
    </div>
  </div>
  <div class="today-line" id="todayLine"></div>
  <main>
    <section>
      <div class="section-head">
        <h2>📌 오늘 풀 분량</h2>
        <span class="count" id="activeCount"></span>
      </div>
      <div id="taskList"></div>
    </section>
    <section id="finishedSection" style="display:none;">
      <div class="section-head">
        <h2>🏁 완주한 문제집</h2>
        <span class="count" id="finishedCount"></span>
      </div>
      <div id="finishedList"></div>
    </section>
  </main>
</div>

<button class="fab" id="addBtn">＋ 문제집 등록</button>

<!-- 처음 등록 -->
<div id="onboardModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>반가워요 📐</h3></div>
    <div class="modal-body">
      <p style="font-size:14px;color:var(--text-muted);margin:0 0 16px;">문제집을 등록하면 하루에 풀 분량을 계산해 드려요.</p>
      <div class="field"><label>닉네임</label><input type="text" id="onboardNick" placeholder="예: 보민" maxlength="10"></div>
      <div class="field"><label>학년</label><select id="onboardGrade"></select></div>
      <p class="form-msg error" id="onboardMsg"></p>
      <button class="btn btn-primary" id="onboardSubmit">시작하기</button>
    </div>
  </div>
</div>

<!-- 등록 / 계획 수정 -->
<div id="addModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3 id="addTitle">문제집 등록</h3><button class="close-btn" data-close="addModal">✕</button></div>
    <div class="modal-body">
      <div class="cover-picker" id="coverPickerBox">
        <div class="cover-preview" id="coverPreview">📕</div>
        <div class="cover-picker-btns">
          <button class="btn btn-primary btn-sm" id="shotBtn">📷 표지 사진 찍기</button>
          <button class="btn btn-outline btn-sm" id="pickBtn">🖼️ 앨범에서 고르기</button>
          <span class="cover-hint">안 올리면 제목으로 표지를 만들어 드려요.</span>
        </div>
      </div>

      <div id="searchBlock">
        <div class="field">
          <label>제목으로 찾기</label>
          <div class="search-row">
            <input type="text" id="searchInput" placeholder="예: 다락원 JLPT N4">
            <button id="searchGoBtn">검색</button>
          </div>
          <p class="form-msg" id="searchMsg"></p>
          <div class="result-list" id="resultList"></div>
        </div>
      </div>

      <div class="field"><label>제목</label><input type="text" id="fTitle" placeholder="문제집 제목"></div>
      <div class="field"><label>출판사</label><input type="text" id="fPublisher" placeholder="출판사 (몰라도 괜찮아요)"></div>
      <div class="field-row">
        <div class="field"><label>총 페이지수 <span id="pagesAuto" style="color:var(--accent);"></span></label><input type="number" id="fPages" inputmode="numeric" min="1" placeholder="예: 500"></div>
        <div class="field"><label>몇 쪽부터</label><input type="number" id="fStartPage" inputmode="numeric" min="1" value="1"></div>
      </div>
      <div class="field"><label>시작한 날</label><input type="date" id="fStartDate"></div>

      <div class="section-head" style="margin-top:6px;"><h2>하루 분량 정하기</h2></div>
      <div class="tabs">
        <button id="tabPages" class="on">하루에 몇 쪽?</button>
        <button id="tabDeadline">언제까지?</button>
      </div>
      <div class="field" id="perDayField"><label>하루에 풀 쪽수</label><input type="number" id="fPerDay" inputmode="numeric" min="1" placeholder="예: 20"></div>
      <div class="field" id="deadlineField" style="display:none;"><label>끝낼 날짜</label><input type="date" id="fDeadline"></div>
      <div class="preview-box" id="planPreview">쪽수와 하루 분량을 넣으면 완주 예정일을 계산해 드려요.</div>

      <p class="form-msg error" id="addMsg"></p>
      <button class="btn btn-primary" id="saveBtn">등록하기</button>
    </div>
  </div>
</div>

<!-- 진도 입력 -->
<div id="progressModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>어디까지 풀었어요?</h3><button class="close-btn" data-close="progressModal">✕</button></div>
    <div class="modal-body">
      <p class="form-msg" id="progressInfo"></p>
      <div class="field"><label>지금까지 푼 마지막 쪽</label><input type="number" id="pPage" inputmode="numeric" min="0"></div>
      <p class="form-msg error" id="progressMsg"></p>
      <button class="btn btn-primary" id="progressSave">저장하고 다시 계산</button>
    </div>
  </div>
</div>

<!-- 상세 -->
<div id="detailModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>문제집 기록</h3><button class="close-btn" data-close="detailModal">✕</button></div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<!-- 공유 -->
<div id="shareModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>오늘의 분량 카드</h3><button class="close-btn" data-close="shareModal">✕</button></div>
    <div class="modal-body">
      <img class="share-img" id="shareImg" alt="오늘의 분량 카드">
      <a class="btn btn-primary" id="shareDownload" download="today-pace.png" style="display:block;text-align:center;text-decoration:none;">이미지 저장하기</a>
      <p class="form-msg">저장이 안 되면 이미지를 길게 눌러 저장하세요.</p>
    </div>
  </div>
</div>

<!-- 설정 -->
<div id="settingsModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>설정</h3><button class="close-btn" data-close="settingsModal">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>닉네임</label><input type="text" id="setNick" maxlength="10"></div>
      <div class="field"><label>학년</label><select id="setGrade"></select></div>
      <div class="field">
        <label>카카오 책 검색 REST 키 (선택)</label>
        <input type="text" id="setKakao" placeholder="비워두면 구글 책 검색을 써요">
        <span class="cover-hint">문제집 책장(day07)과 같은 키를 함께 씁니다.</span>
      </div>
      <p class="form-msg success" id="setMsg"></p>
      <button class="btn btn-primary" id="setSaveBtn">저장</button>
      <p class="cover-hint" style="margin-top:16px;">완주한 문제집은 같은 사이트의 <b>문제집 책장(day07)</b>에 자동으로 꽂혀요.</p>
      <button class="danger-link" id="resetBtn">기록 전체 지우기</button>
    </div>
  </div>
</div>

<div id="confetti"></div>
<div class="cheer" id="cheer">
  <div class="emo">🎉</div>
  <div class="msg" id="cheerMsg"></div>
  <div class="sub" id="cheerSub"></div>
  <div class="shelf-note" id="cheerShelf" style="display:none;"></div>
</div>

<input type="file" id="shotInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="pickInput" accept="image/*" style="display:none">

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'workbook-pace-v1';
  var SHELF_KEY = 'workbook-shelf-v1';        // day07 문제집 책장과 공유하는 저장소
  var GOOGLE_BOOKS_API_KEY = 'AIzaSyBshQZw_rI3UFS7cY6hlvUvS614CgLkBOk';
  var APP_URL = 'bominkimkr.github.io/one-app-a-day';
  var GRADES = ['중1', '중2', '중3', '고1', '고2', '고3'];

  // day07과 같은 규칙으로 과목/학년을 뽑아, 책장에 꽂힐 때 분류가 맞도록 한다.
  var SUBJECTS = [
    { name: '수학', color: '#3f6fd8', emoji: '📐' },
    { name: '영어', color: '#e8590c', emoji: '🔤' },
    { name: '국어', color: '#d6336c', emoji: '✏️' },
    { name: '과학', color: '#0ca678', emoji: '🔬' },
    { name: '사회', color: '#f08c00', emoji: '🌏' },
    { name: '한국사', color: '#7950f2', emoji: '🏛️' },
    { name: '기타', color: '#7c8189', emoji: '📘' }

  function loadState() {

        state.profile = p.profile || null;

  // ---------- 유틸 ----------
  function $(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return dstr(new Date()); }
  function parseDate(s) {
    if (!s) return null;
    var p = String(s).split('-');
    if (p.length !== 3) return null;
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return isNaN(d.getTime()) ? null : d;
  }
  function addDays(s, n) {
    var d = parseDate(s);
    if (!d) return null;
    d.setDate(d.getDate() + n);
    return dstr(d);
  }
  function diffDays(a, b) { // b - a (일)
    var x = parseDate(a), y = parseDate(b);
    if (!x || !y) return null;
    return Math.round((y - x) / 86400000);
  }
  function formatKDate(s) {
    var d = parseDate(s);
    if (!d) return '-';
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function showMsg(id, text, cls) {
    var el = $(id);
    if (!el) return;
    el.textContent = text;
    el.className = 'form-msg' + (cls ? ' ' + cls : '');
  }
  function findBook(id) {
    for (var i = 0; i < state.books.length; i++) if (state.books[i].id === id) return state.books[i];
    return null;
  }
  function subjectOf(name) {
    for (var i = 0; i < SUBJECTS.length; i++) if (SUBJECTS[i].name === name) return SUBJECTS[i];
    return SUBJECTS[SUBJECTS.length - 1];
  }
  function guessSubject(text) {
    var t = String(text || '').toLowerCase();
    var best = null, bestScore = 0;
    Object.keys(SUBJECT_KEYWORDS).forEach(function (subject) {
      var score = 0;
      SUBJECT_KEYWORDS[subject].forEach(function (kw) {
        if (t.indexOf(kw.toLowerCase()) !== -1) score += kw.length >= 3 ? 2 : 1;
      });
      if (score > bestScore) { bestScore = score; best = subject; }
    });
    return best || '기타';
  }
  function guessGrade(text) {
    var t = String(text || '');
    if (/예비\s*고/.test(t)) return '고1';
    if (/수능특강|수능완성|수능|평가원|모의고사/.test(t)) return '수능';
    var m = t.match(/([중고])\s*등?\s*학?\s*교?\s*([1-3])\s*학년/);
    if (m) return m[1] + m[2];
    m = t.match(/(중|고)\s*([1-3])(?![0-9])/);
    if (m) return m[1] + m[2];
    var isMiddle = /중등|중학/.test(t), isHigh = /고등|고교/.test(t);
    if (isMiddle || isHigh) {
      var n = t.match(/(?:^|[^0-9])([1-3])\s*(?:-\s*[1-2]|학년)/);
      if (n) return (isMiddle ? '중' : '고') + n[1];
      return isMiddle ? '중등 공통' : '고등 공통';
    }
    return (state.profile && state.profile.grade) || '중등 공통';
  }

  // ---------- 표지 ----------
  function cropToCover(file, targetW, targetH) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement('canvas');
          canvas.width = targetW; canvas.height = targetH;
          var ctx = canvas.getContext('2d');
          var srcRatio = img.width / img.height, dstRatio = targetW / targetH;
          var sx, sy, sw, sh;
          if (srcRatio > dstRatio) { sh = img.height; sw = sh * dstRatio; sx = (img.width - sw) / 2; sy = 0; }
          else { sw = img.width; sh = sw / dstRatio; sx = 0; sy = (img.height - sh) / 2; }
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function shade(hex, amt) {
    var m = /^#([0-9a-f]{6})$/i.exec(hex);
    if (!m) return hex;
    var n = parseInt(m[1], 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    function adj(c) { return Math.max(0, Math.min(255, Math.round(c + 255 * amt))); }
    return 'rgb(' + adj(r) + ',' + adj(g) + ',' + adj(b) + ')';
  }
  function wrapText(ctx, text, maxWidth) {
    var chars = String(text).split('');
    var lines = [], line = '';
    for (var i = 0; i < chars.length; i++) {
      var test = line + chars[i];
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = chars[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }
  function makeGeneratedCover(title, publisher, subject, grade) {
    var canvas = document.createElement('canvas');
    canvas.width = 480; canvas.height = 720;
    var ctx = canvas.getContext('2d');
    var sub = subjectOf(subject);
    var grad = ctx.createLinearGradient(0, 0, 0, 720);
    grad.addColorStop(0, sub.color);
    grad.addColorStop(1, shade(sub.color, -0.35));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 480, 720);
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fillRect(0, 0, 26, 720);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(56, 560, 368, 3);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = '600 46px sans-serif';
    var lines = wrapText(ctx, String(title || '문제집'), 350);
    var startY = 250 - (Math.min(lines.length, 4) - 1) * 30;
    lines.slice(0, 4).forEach(function (line, i) { ctx.fillText(line, 250, startY + i * 60); });
    ctx.font = '30px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText(sub.emoji + ' ' + sub.name, 250, 610);
    ctx.font = '26px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(grade || '', 250, 652);
    if (publisher) { ctx.font = '24px sans-serif'; ctx.fillText(publisher, 250, 690); }
    return canvas.toDataURL('image/jpeg', 0.85);
  }
  function fetchCoverAsDataUrl(url) {
    return new Promise(function (resolve) {
      if (!url) return resolve(null);
      var img = new Image();
      img.crossOrigin = 'anonymous';
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; resolve(null); } }, 6000);
      img.onload = function () {
        if (done) return;
        done = true; clearTimeout(timer);
        try {
          var canvas = document.createElement('canvas');
          canvas.width = 480; canvas.height = 720;
          var ctx = canvas.getContext('2d');
          var srcRatio = img.width / img.height, dstRatio = 480 / 720;
          var sx, sy, sw, sh;
          if (srcRatio > dstRatio) { sh = img.height; sw = sh * dstRatio; sx = (img.width - sw) / 2; sy = 0; }
          else { sw = img.width; sh = sw / dstRatio; sx = 0; sy = (img.height - sh) / 2; }
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 480, 720);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        } catch (e) { resolve(null); }
      };
      img.onerror = function () { if (!done) { done = true; clearTimeout(timer); resolve(null); } };
      img.src = url.replace(/^http:/, 'https:');
    });
  }

  // ---------- 책 검색 ----------
  function searchBooks(query) {
    if (state.kakaoKey) return searchKakao(query).catch(function () { return searchGoogle(query); });
    return searchGoogle(query);
  }
  function searchKakao(query) {
    var url = 'https://dapi.kakao.com/v3/search/book?size=10&target=title&query=' + encodeURIComponent(query);
    return fetch(url, { headers: { Authorization: 'KakaoAK ' + state.kakaoKey } })
      .then(function (r) { if (!r.ok) throw new Error('kakao ' + r.status); return r.json(); })
      .then(function (data) {
        return (data.documents || []).map(function (d) {
          return { title: d.title || '', publisher: d.publisher || '', thumbnail: d.thumbnail || '', pageCount: 0 };
        });
      });
  }
  function searchGoogle(query) {
    var url = 'https://www.googleapis.com/books/v1/volumes?maxResults=10&country=KR&q=' +
      encodeURIComponent(query) + '&key=' + GOOGLE_BOOKS_API_KEY;
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('google ' + r.status); return r.json(); })
      .then(function (data) {
        return (data.items || []).map(function (item) {
          var v = item.volumeInfo || {};
          var thumb = (v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail)) || '';
          return {
            title: v.title || '',
            publisher: v.publisher || (v.authors ? v.authors.join(', ') : ''),
            thumbnail: thumb,
            pageCount: v.pageCount || 0
          };
        });
      });
  }

  // ---------- 계획 계산 (핵심) ----------
  function donePageOf(b) {
    var base = (b.startPage || 1) - 1;
    var sum = 0;
    Object.keys(b.logs || {}).forEach(function (d) { sum += b.logs[d] || 0; });
    return Math.min(b.totalPages, base + sum);
  }

  function computePlan(b) {
    var today = todayStr();
    var startPage = b.startPage || 1;
    var total = b.totalPages;
    var done = donePageOf(b);
    var remaining = Math.max(0, total - done);
    var scopeTotal = total - (startPage - 1);

    // 하루 분량: 기한 방식은 남은 날짜로 매일 다시 나눈다.
    var perDay = b.perDay;
    if (b.mode === 'deadline' && b.deadline && remaining > 0) {
      var daysLeft = diffDays(today, b.deadline) + 1; // 오늘 포함
      perDay = daysLeft > 0 ? Math.ceil(remaining / daysLeft) : remaining;
    }
    perDay = Math.max(1, perDay || 1);

    // 계획대로라면 어제까지 끝냈어야 할 쪽
    var elapsed = Math.max(0, diffDays(b.startDate, today)); // 시작일부터 오늘까지 지난 날 수
    var plannedByYesterday = Math.min(total, (startPage - 1) + (b.perDay || perDay) * elapsed);
    var behindPages = Math.max(0, plannedByYesterday - done);
    var behindDays = behindPages > 0 ? Math.ceil(behindPages / (b.perDay || perDay)) : 0;

    var todayFrom = done + 1;
    var todayTo = Math.min(total, done + perDay);
    var todayPages = Math.max(0, todayTo - todayFrom + 1);
    var todayDoneAmount = (b.logs && b.logs[today]) || 0;
    var todayDone = remaining === 0 || todayDoneAmount >= perDay;

    // 완주 예정일
    var daysNeeded = remaining > 0 ? Math.ceil(remaining / perDay) : 0;
    var finishDate = remaining > 0 ? addDays(today, daysNeeded - 1) : (b.finishedAt || today);
    var originalDays = Math.ceil(scopeTotal / (b.perDay || perDay));
    var originalFinish = addDays(b.startDate, originalDays - 1);
    var delayDays = Math.max(0, diffDays(originalFinish, finishDate) || 0);

    return {
      perDay: perDay, done: done, remaining: remaining, total: total,
      progress: total > 0 ? Math.round(done / total * 100) : 0,
      scopeProgress: scopeTotal > 0 ? Math.round((done - (startPage - 1)) / scopeTotal * 100) : 0,
      todayFrom: todayFrom, todayTo: todayTo, todayPages: todayPages,
      todayDone: todayDone, todayDoneAmount: todayDoneAmount,
      behindPages: behindPages, behindDays: behindDays,
      finishDate: finishDate, originalFinish: originalFinish, delayDays: delayDays,
      streak: computeStreak(b, b.perDay || perDay),
      finished: remaining === 0
    };
  }

  function computeStreak(b, perDay) {
    var logs = b.logs || {};
    var streak = 0;
    var cursor = todayStr();
    // 오늘 아직 안 했으면 어제부터 센다
    if (((logs[cursor]) || 0) < perDay) cursor = addDays(cursor, -1);
    while (cursor && cursor >= b.startDate) {
      if ((logs[cursor] || 0) >= perDay) { streak++; cursor = addDays(cursor, -1); }
      else break;
    }
    return streak;
  }

  // ---------- 렌더링 ----------
  function render() {
    if (!state.profile) return;
    $('pageTitle').textContent = state.profile.nickname + '의 하루 분량';
    document.title = state.profile.nickname + '의 하루 분량';
    var d = new Date();
    var totalStreak = 0;
    state.books.forEach(function (b) {
      if (b.finishedAt) return;
      var p = computePlan(b);
      if (p.streak > totalStreak) totalStreak = p.streak;
    });
    $('todayLine').innerHTML = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' +
      ['일', '월', '화', '수', '목', '금', '토'][d.getDay()] + '요일' +
      (totalStreak > 0 ? '<span class="streak-badge">🔥 ' + totalStreak + '일 연속 완수</span>' : '');
    renderTasks();
    renderFinished();
  }

  function renderTasks() {
    var active = state.books.filter(function (b) { return !b.finishedAt; })
      .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    $('activeCount').textContent = active.length ? active.length + '권' : '';
    var box = $('taskList');
    if (!active.length) {
      box.innerHTML = '<div class="empty-hint">등록된 문제집이 없어요.<br>아래 버튼으로 한 권 등록해 보세요 📘</div>';
      return;
    }
    box.innerHTML = active.map(function (b) {
      var p = computePlan(b);
      var html = '<div class="task-card' + (p.todayDone ? ' done' : '') + '">';
      html += '<div class="task-head">' +
        '<div class="task-cover" data-open="' + b.id + '"><img src="' + escapeHtml(b.cover) + '" alt=""></div>' +
        '<div class="task-meta">' +
        '<div class="task-title">' + escapeHtml(b.title) + '</div>' +
        '<div class="task-sub">' + (b.publisher ? escapeHtml(b.publisher) + ' · ' : '') + '총 ' + b.totalPages + '쪽 · 하루 ' + p.perDay + '쪽' +
        (p.streak > 0 ? ' · 🔥' + p.streak + '일' : '') + '</div>' +
        '</div></div>';

      html += '<div class="range">';
      if (p.todayDone) {
        html += '<div class="alldone">오늘 분량 완수! 🎉</div>' +
          '<div class="amount">오늘 ' + p.todayDoneAmount + '쪽 · p.' + p.done + '까지</div>';
      } else {
        html += '<div class="big">p.' + p.todayFrom + ' ~ p.' + p.todayTo + '</div>' +
          '<div class="amount">오늘 ' + p.todayPages + '쪽</div>';
      }
      html += '</div>';

      html += '<div class="progress"><div style="width:' + Math.max(2, p.progress) + '%"></div></div>' +
        '<div class="progress-label"><span>' + p.done + ' / ' + b.totalPages + '쪽 (' + p.progress + '%)</span>' +
        '<span>완주 ' + formatKDate(p.finishDate) + ' 예정</span></div>';

      if (p.behindPages > 0) {
        html += '<div class="alert">⏰ 어제까지 분량이 ' + p.behindPages + '쪽 밀렸어요.<br>' +
          (p.delayDays > 0
            ? '이 페이스면 완주가 ' + p.delayDays + '일 늦어져요. (' + formatKDate(p.originalFinish) + ' → ' + formatKDate(p.finishDate) + ')'
            : '오늘 분량까지 하면 다시 따라잡을 수 있어요!') + '</div>';
      } else if (!p.todayDone && p.streak > 0) {
        html += '<div class="alert ok">🔥 ' + p.streak + '일 연속 완수 중! 오늘도 이어가요.</div>';
      }

      if (!p.todayDone) {
        html += '<button class="btn btn-primary" data-finishday="' + b.id + '">✅ 오늘 분량 완수!</button>';
        html += '<button class="link-btn" data-partial="' + b.id + '">조금만 했어요 · 여기까지 풀었어요</button>';
      } else {
        html += '<button class="btn btn-outline" data-partial="' + b.id + '">더 풀었어요 · 쪽수 고치기</button>';
      }
      html += '</div>';
      return html;
    }).join('');
  }

  function renderFinished() {
    var fin = state.books.filter(function (b) { return b.finishedAt; })
      .sort(function (a, b) { return a.finishedAt < b.finishedAt ? 1 : -1; });
    $('finishedSection').style.display = fin.length ? 'block' : 'none';
    $('finishedCount').textContent = fin.length ? fin.length + '권' : '';
    $('finishedList').innerHTML = fin.map(function (b) {
      var days = (diffDays(b.startDate, b.finishedAt) || 0) + 1;
      return '<div class="done-card" data-open="' + b.id + '">' +
        '<div class="task-cover"><img src="' + escapeHtml(b.cover) + '" alt=""></div>' +
        '<div><div class="dc-title">' + escapeHtml(b.title) + '</div>' +
        '<div class="dc-sub">' + b.totalPages + '쪽 · ' + days + '일 만에 완주</div>' +
        (b.shelfPushed ? '<span class="shelf-tag">📚 책장에 꽂힘</span>' : '') +
        '</div></div>';
    }).join('');
  }

  // ---------- 오늘 분량 체크 ----------
  function completeToday(id) {
    var b = findBook(id);
    if (!b || b.finishedAt) return;
    var p = computePlan(b);
    if (p.todayPages <= 0) return;
    var today = todayStr();
    b.logs = b.logs || {};
    b.logs[today] = (b.logs[today] || 0) + p.todayPages;
    afterProgress(b, p.perDay);
  }

  function afterProgress(b, perDay) {
    var done = donePageOf(b);
    if (done >= b.totalPages && !b.finishedAt) {
      b.finishedAt = todayStr();
      saveState();
      var pushed = pushToShelf(b);
      saveState();
      render();
      celebrateFinish(b, pushed);
      return;
    }
    saveState();
    render();
    var p = computePlan(b);
    if (p.todayDone) celebrateDay(b, p, perDay);
  }

  function celebrateDay(b, p, perDay) {
    $('cheerMsg').textContent = '오늘 분량 완수!';
    $('cheerSub').textContent = b.title + '\np.' + p.done + '까지 · 남은 ' + p.remaining + '쪽' +
      (p.streak > 1 ? ' · 🔥' + p.streak + '일 연속' : '');
    $('cheerShelf').style.display = 'none';
    popCheer(['🎉', '✨', '✅', '💪'], 1800);
  }

  function celebrateFinish(b, pushed) {
    var days = (diffDays(b.startDate, b.finishedAt) || 0) + 1;
    $('cheerMsg').textContent = '완주했어요! 🏁';
    $('cheerSub').textContent = b.title + '\n' + b.totalPages + '쪽 · ' + days + '일 만에 끝!';
    var note = $('cheerShelf');
    note.style.display = 'block';

  function popCheer(emojis, ms) {

    for (var i = 0; i < 32; i++) {

      s.className = 'conf';
      s.textContent = emojis[i % emojis.length];
      s.style.left = Math.random() * 96 + '%';
      s.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
      s.style.animationDelay = (Math.random() * 0.5) + 's';
      layer.appendChild(s);

  // ---------- day07 책장 연동 ----------
  function pushToShelf(b) {
    try {
      var shelf = readShelf() || { profile: null, books: [], kakaoKey: state.kakaoKey || '' };
      if (!Array.isArray(shelf.books)) shelf.books = [];
      if (!shelf.profile && state.profile) {
        shelf.profile = {
          nickname: state.profile.nickname,
          grade: GRADES.indexOf(state.profile.grade) !== -1 ? state.profile.grade : '중1'
        };
      }
      // 같은 제목이 이미 꽂혀 있으면 중복 등록하지 않는다.
      var dup = shelf.books.some(function (x) { return x.title === b.title && x.startDate === b.startDate; });
      if (!dup) {
        var text = b.title + ' ' + (b.publisher || '');
        var days = (diffDays(b.startDate, b.finishedAt) || 0) + 1;
        shelf.books.push({
          id: 'pace-' + b.id,
          title: b.title,
          publisher: b.publisher || '',
          subject: guessSubject(text),
          grade: guessGrade(text),
          isbn: '',
          cover: b.cover,
          startDate: b.startDate,
          endDate: b.finishedAt,
          memo: '하루 ' + (b.perDay || 1) + '쪽씩 ' + days + '일 완주 (' + b.totalPages + '쪽)',
          createdAt: b.createdAt || Date.now()
        });
      }
      localStorage.setItem(SHELF_KEY, JSON.stringify(shelf));
      b.shelfPushed = true;
      return true;
    } catch (e) {
      b.shelfPushed = false;
      return false;
    }
  }

  $('progressSave').addEventListener('click', function () {
    var b = findBook(progressTargetId);
    if (!b) return;
    var page = Number($('pPage').value);
    var startPage = b.startPage || 1;
    if (!page && page !== 0) { showMsg('progressMsg', '쪽수를 입력해 주세요.', 'error'); return; }
    if (page > b.totalPages) { showMsg('progressMsg', '총 페이지수(' + b.totalPages + '쪽)보다 클 수 없어요.', 'error'); return; }
    if (page < startPage - 1) { showMsg('progressMsg', startPage + '쪽부터 푸는 문제집이에요.', 'error'); return; }
    var before = donePageOf(b);
    var delta = page - before;
    if (delta === 0) { closeModal('progressModal'); return; }
    var today = todayStr();
    b.logs = b.logs || {};
    b.logs[today] = Math.max(0, (b.logs[today] || 0) + delta);

  function setPlanMode(mode) {

  function planInputs() {
    var total = Number($('fPages').value) || 0;
    var startPage = Math.max(1, Number($('fStartPage').value) || 1);
    var startDate = $('fStartDate').value || todayStr();
    var scope = total - (startPage - 1);
    return { total: total, startPage: startPage, startDate: startDate, scope: scope };
  }

  function updatePreview() {
    var i = planInputs();
    var box = $('planPreview');
    if (!i.total || i.scope <= 0) {
      box.textContent = '총 페이지수를 넣으면 계산해 드려요.';
      return;
    }
    if (planMode === 'pages') {
      var perDay = Number($('fPerDay').value) || 0;
      if (!perDay) { box.textContent = '하루에 풀 쪽수를 넣어 주세요.'; return; }
      var days = Math.ceil(i.scope / perDay);
      var finish = addDays(i.startDate, days - 1);
      box.textContent = '하루 ' + perDay + '쪽씩 풀면 ' + days + '일 걸려요.\n' + formatKDate(finish) + '에 완주 예정!';
    } else {
      var deadline = $('fDeadline').value;
      if (!deadline) { box.textContent = '끝낼 날짜를 골라 주세요.'; return; }
      var span = diffDays(i.startDate, deadline) + 1;
      if (span <= 0) { box.textContent = '끝낼 날짜가 시작한 날보다 빨라요.'; return; }
      var per = Math.ceil(i.scope / span);
      box.textContent = i.scope + '쪽 ÷ ' + span + '일 = 하루 ' + per + '쪽!\n' + formatKDate(deadline) + '까지 끝내려면 매일 ' + per + '쪽씩.';
    }

    if (i.startPage > i.total) { showMsg('addMsg', '시작 쪽이 총 페이지수보다 큽니다.', 'error'); return; }

    var mode = planMode, perDay = 0, deadline = '';

      if (perDay < 1) { showMsg('addMsg', '하루에 풀 쪽수를 넣어 주세요.', 'error'); return; }

  function loadImg(src) {
    return new Promise(function (resolve) {
      if (!src) return resolve(null);
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { resolve(null); };
      img.src = src;
    });
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  $('shareBtn').addEventListener('click', function () {
    var active = state.books.filter(function (b) { return !b.finishedAt; }).slice(0, 3);
    Promise.all(active.map(function (b) { return loadImg(b.cover); })).then(function (imgs) {
      var url = buildShareCanvas(active, imgs);
      $('shareImg').src = url;
      $('shareDownload').href = url;
      $('shareDownload').download = (state.profile ? state.profile.nickname : 'my') + '-today-pace.png';
      openModal('shareModal');
    });
  });

  function buildShareCanvas(books, imgs) {
    var W = 1080, H = 1920;
    var canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');

    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#f4f7f2');
    grad.addColorStop(1, '#dfeae1');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    var d = new Date();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#1f7a5a';
    ctx.font = 'bold 40px sans-serif';
    ctx.fillText('오늘의 분량', W / 2, 140);
    ctx.fillStyle = '#26241f';
    ctx.font = 'bold 62px sans-serif';
    ctx.fillText((state.profile ? state.profile.nickname : '나') + '의 하루 계획', W / 2, 224);
    ctx.fillStyle = '#857e70';
    ctx.font = '34px sans-serif';
    ctx.fillText((d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + ['일', '월', '화', '수', '목', '금', '토'][d.getDay()] + '요일', W / 2, 282);

    var cardH = 330, gapY = 26;
    // 카드 블록을 제목과 하단 문구 사이에 세로 중앙 정렬
    var bandTop = 340, bandH = 1220;
    var blockH = books.length ? books.length * cardH + (books.length - 1) * gapY : 0;
    var y = bandTop + Math.round((bandH - blockH) / 2);

    if (!books.length) {
      ctx.fillStyle = '#857e70';
      ctx.font = '40px sans-serif';
      ctx.fillText('오늘 풀 문제집이 없어요', W / 2, bandTop + bandH / 2);
    }
    books.forEach(function (b, idx) {
      var p = computePlan(b);
      var x = 70, w = W - 140;
      ctx.fillStyle = '#ffffff';
      ctx.save();
      ctx.shadowColor = 'rgba(40,60,40,0.16)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 8;
      roundRect(ctx, x, y, w, cardH, 26);
      ctx.fill();
      ctx.restore();

      var img = imgs[idx];
      if (img) {
        ctx.save();
        roundRect(ctx, x + 34, y + 44, 148, 222, 8);
        ctx.clip();
        ctx.drawImage(img, x + 34, y + 44, 148, 222);
        ctx.restore();
      }

      var tx = x + 216, tw = w - 260;
      ctx.textAlign = 'left';
      ctx.fillStyle = '#26241f';
      ctx.font = 'bold 36px sans-serif';
      var lines = wrapText(ctx, b.title, tw).slice(0, 2);
      lines.forEach(function (line, i) { ctx.fillText(line, tx, y + 72 + i * 42); });

      var afterTitle = y + 72 + (lines.length - 1) * 42;
      ctx.fillStyle = p.todayDone ? '#1f7a5a' : '#26241f';
      ctx.font = 'bold 54px sans-serif';
      ctx.fillText(p.todayDone ? '오늘 완수 ✅' : 'p.' + p.todayFrom + ' ~ p.' + p.todayTo, tx, afterTitle + 64);

      ctx.fillStyle = '#1f7a5a';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText(p.todayDone ? ('p.' + p.done + '까지 · 남은 ' + p.remaining + '쪽') : ('오늘 ' + p.todayPages + '쪽 · 남은 ' + p.remaining + '쪽'), tx, afterTitle + 108);

      // 진행률 바
      var barY = y + cardH - 44;
      ctx.fillStyle = '#857e70';
      ctx.font = '26px sans-serif';
      ctx.fillText(p.progress + '% · 완주 ' + formatKDate(p.finishDate) + ' 예정', tx, barY - 16);
      ctx.fillStyle = '#dff0e8';
      roundRect(ctx, tx, barY, tw, 16, 8);
      ctx.fill();
      ctx.fillStyle = '#1f7a5a';
      roundRect(ctx, tx, barY, Math.max(12, tw * p.progress / 100), 16, 8);
      ctx.fill();

      ctx.textAlign = 'center';
      y += cardH + gapY;
    });

    // 남은 문제집 수 + 스트릭
    var activeTotal = state.books.filter(function (b) { return !b.finishedAt; }).length;
    var footY = 1620;
    ctx.textAlign = 'center';
    if (activeTotal > books.length) {
      ctx.fillStyle = '#857e70';
      ctx.font = '32px sans-serif';
      ctx.fillText('그리고 ' + (activeTotal - books.length) + '권 더 풀고 있어요', W / 2, footY);
      footY += 58;
    }
    var best = 0;
    state.books.forEach(function (b) {
      if (b.finishedAt) return;
      var p = computePlan(b);
      if (p.streak > best) best = p.streak;
    });
    if (best > 0) {
      ctx.fillStyle = '#c9700f';
      ctx.font = 'bold 40px sans-serif';
      ctx.fillText('🔥 ' + best + '일 연속 완수 중', W / 2, footY);
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#8d9488';
    ctx.font = '28px sans-serif';
    ctx.fillText('문제집 하루 분량 · ' + APP_URL, W / 2, H - 70);

    try { return canvas.toDataURL('image/png'); } catch (e) { return ''; }
  }

  // ---------- 시작 ----------
  loadState();
  fillSelect($('onboardGrade'), GRADES, '중2');
  fillSelect($('setGrade'), GRADES, '중2');
  $('fStartDate').value = todayStr();
  if (!state.profile) openModal('onboardModal');
  else render();
})();
</script>
</body>
</html>
